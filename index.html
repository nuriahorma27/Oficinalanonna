<title>Oficina virtual · La Nonna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Plano de oficina: una fila de departamentos arriba; debajo, el equipo en organigrama a la izquierda y el chat de la persona elegida a la derecha. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --ink:#1b2233; --muted:#5b6679; --line:#dbe0ea; --soft:#e9ecf3;
  --dir:#5b4bd1; --com:#b4423a; --cont:#17775a; --ate:#a46a0c; --comp:#1f62a8;
  --on-accent:#ffffff;
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1f2b; --ink:#eceff6; --muted:#9aa5b8; --line:#2b3345; --soft:#232a39;
    --dir:#9d92ff; --com:#ff8b80; --cont:#5fcfa6; --ate:#e7b155; --comp:#79b4f0;
    --on-accent:#10131a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1f2b; --ink:#eceff6; --muted:#9aa5b8; --line:#2b3345; --soft:#232a39;
  --dir:#9d92ff; --com:#ff8b80; --cont:#5fcfa6; --ate:#e7b155; --comp:#79b4f0;
  --on-accent:#10131a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500}
.links a:hover,.links a:focus-visible{border-color:var(--ink)}
.floor{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.room{--c:var(--dir);text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);
  border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.room b{font-weight:600;font-size:15px}
.room span{color:var(--muted);font-size:13px}
.room[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:1px;background:var(--soft)}
.room:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.person{--c:var(--dir);position:relative;display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.person[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.person:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.who{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:13px}
.agent{font-family:var(--font-mono);font-size:12px;color:var(--c);margin-top:8px;display:block}
.person ul{margin:10px 0 0;padding-left:18px;color:var(--ink);font-size:14px}
.person li{margin:2px 0}
.person .rep{margin:10px 0 0;color:var(--muted);font-size:13px}
.org-link{position:relative;height:16px}
.org-link::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line)}
.org-row{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px}
.org-row::before{content:"";position:absolute;top:0;left:25%;right:25%;border-top:2px solid var(--line)}
.org-row>.person::before{content:"";position:absolute;top:-16px;left:50%;height:16px;border-left:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.rhythm{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.rhythm h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.rhythm dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.rhythm dt{font-family:var(--font-mono);font-size:12px;color:var(--cont);padding-top:2px}
.rhythm dd{margin:0}
.chat{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(16px, env(safe-area-inset-top, 0px))}
.chat-head{display:flex;gap:12px;align-items:center;--c:var(--dir)}
.chat-head .avatar{width:40px;height:40px;font-size:14px}
.chat-head b{display:block;font-weight:600}
.chat-head small{color:var(--muted);font-size:13px}
.log{height:min(46vh,400px);min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.msg.yo{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.ellos{align-self:flex-start;background:var(--soft)}
.msg.aviso{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--ink)}
form.send{display:flex;gap:8px}
form.send textarea{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical;min-height:44px;max-height:160px}
form.send textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
form.send button{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
form.send button:disabled{opacity:.5;cursor:default}
.note{color:var(--muted);font-size:12.5px;margin:0}
.note code{font-family:var(--font-mono);font-size:12px}

.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:640px}
.scene .char{cursor:pointer;outline:none}
.scene .char:focus-visible .tagbox{stroke-width:3}
.scene .tagbox{fill:#ffffff;stroke:var(--tc);stroke-width:1.5}
.scene .tagtxt{font-family:var(--font-body);font-size:12.5px;font-weight:600;fill:#1b2233}
.scene .char.sel .tagbox{fill:var(--tc)}
.scene .char.sel .tagtxt{fill:#ffffff}
.scene .char:hover .tagbox{stroke-width:2.5}
.scene .zlabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;fill:#7b6a55}
.scene-cap{margin:6px 8px 6px;color:var(--muted);font-size:13px}
@media (max-width:700px){ .scene .char:not(.sel) .tag{display:none} }

.extracto{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.extracto h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.extracto p{margin:0;font-size:14px}
.extracto .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.extracto select,.extracto input[type=file]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
.extracto button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.extracto button.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.extracto button:disabled{opacity:.5;cursor:default}
.extracto .estado{min-height:1.4em;color:var(--muted);font-size:13.5px}
.extracto .estado.ok{color:var(--cont)}
.extracto .estado.mal{color:var(--com)}
.extracto ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
.extracto a{color:var(--ink)}
@media (max-width:900px){
  .floor{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{grid-template-columns:minmax(0,1fr)}
  .chat{position:static}
}
@media (max-width:560px){
  .org-row{grid-template-columns:1fr}
  .org-row::before,.org-row>.person::before{display:none}
}

.floor{grid-template-columns:repeat(6,minmax(0,1fr))}
#bandeja{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
#bandeja[hidden],.main[hidden]{display:none}
.bandeja-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:start;justify-content:space-between;margin-bottom:8px}
.bandeja-cab>div{flex:1 1 280px}
.bandeja-cab button,.prop button,.minichat+textarea+button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.bandeja-cab button.sec,.prop button.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.prop button.ok{background:var(--cont);border-color:var(--cont);color:#fff}
.prop button:disabled{opacity:.5;cursor:default}
.enl{color:var(--ink);font-size:14px;padding:8px 4px}
.lista{display:flex;flex-direction:column;gap:14px}
.lista h3,#bandeja h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;font-weight:600}
.lista h4,.prop h4{font-size:13px;margin:12px 0 4px;color:var(--muted);font-weight:600}
.prop{border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:10px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.prop-cab{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.prop-cab b{display:block;font-weight:600}
.prop-cab small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.ins{display:flex;flex-wrap:wrap;gap:6px;align-items:start}
.ins-i{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.prop details{font-size:14px}
.prop summary{cursor:pointer;color:var(--muted)}
.orig{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 0;max-height:240px;overflow:auto}
.borrador,.prop textarea,.prop input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.borrador[readonly]{background:var(--soft)}
.motivo,.cuenta,.vacio{margin:0;color:var(--muted);font-size:13.5px}
.cuenta{color:var(--ink);font-weight:600}
.acciones,.zona{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zona{flex-direction:column;align-items:stretch}
.zona>button{align-self:flex-start}
.minichat .msg{max-width:100%}
.nota{margin:0;color:var(--muted);font-size:13px}
#bandeja .estado{margin:0;min-height:1.2em;color:var(--muted);font-size:13.5px}
#bandeja .estado.ok{color:var(--cont)}
#bandeja .estado.mal{color:var(--com)}
.corta{margin:0;padding-left:18px;font-size:14px}
.gente{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gp{font:inherit;color:inherit;text-align:left;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--ate);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column}
.gp small{color:var(--muted);font-size:12.5px}.gp .n{margin-top:4px;font-size:13px;font-weight:600}
.quien{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.quien dt{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:3px}.quien dd{margin:0}
.enl-b{font:inherit;font-size:14px;font-weight:600;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
@media (max-width:900px){.floor{grid-template-columns:repeat(2,minmax(0,1fr))}.gente{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gente{grid-template-columns:1fr}.quien{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 12px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.ambar{border-color:var(--ate)}.kpi.rojo b{color:var(--com)}.kpi.verde b{color:var(--cont)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ate)}
.duo{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
.correos{display:flex;flex-direction:column;gap:6px}
.corr{font:inherit;color:inherit;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.corr b{font-weight:600;font-size:14px}.corr small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.corr .mini{font-size:12px;color:var(--muted)}
.corr.u3{border-left-color:var(--com)}.corr.u2{border-left-color:var(--ate)}.corr.u1{border-left-color:var(--cont)}
.corr[aria-pressed="true"]{background:var(--soft);box-shadow:0 0 0 2px var(--ink)}
.ficha{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.ficha-cab{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
#bandeja .ficha h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.25rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.ficha small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.asunto{margin:2px 0 0;font-weight:600;font-size:14px}
.chips-f{display:flex;gap:6px;flex-wrap:wrap;align-items:start}
.chp{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface)}
.chp.u3{border-color:var(--com);color:var(--com)}.chp.u2{border-color:var(--ate);color:var(--ate)}.chp.u1,.chp.okc{border-color:var(--cont);color:var(--cont)}
.resumen{margin:0}
.datos{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0;font-size:14px}
.datos dt{color:var(--muted);font-size:12.5px;padding-top:2px}.datos dd{margin:0}.datos dd.aviso{color:var(--com);font-weight:600}
.avisos{margin:0;padding:10px 12px 10px 28px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:8px;font-size:13.5px}
.avisos li{margin:3px 0}
.hist{margin:0;padding-left:18px;font-size:13.5px}.hist li{margin:2px 0}
.aviso-b{margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:8px;font-size:14px}
.barras{display:flex;flex-direction:column;gap:6px}
.barra{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;font-size:13.5px}
.barra i{display:block;height:10px;background:var(--ate);border-radius:5px;min-width:3px}.barra i.ruido{background:var(--muted)}
.barra em{font-style:normal;color:var(--muted)}
.semanas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.sem{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);display:flex;flex-direction:column}
.sem small{color:var(--muted);font-size:11.5px}.sem b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.1}.sem span{font-size:11.5px;color:var(--muted)}
.sem.casi{border-color:var(--ate);background:var(--soft)}.sem.llena{border-color:var(--com);background:var(--soft)}.sem.llena b{color:var(--com)}
.scroll-x{overflow-x:auto}
.tabla{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
.tabla th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tabla td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tabla td.mal{color:var(--com);font-weight:600}
.ajustes .aj{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.ajustes label{flex:1 1 260px;font-size:14px}.ajustes input{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;flex:0 1 260px}
.ajustes button,.ficha button.sec{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ficha button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.ficha button.ok{background:var(--cont);border-color:var(--cont);color:#fff}
.ficha button:disabled{opacity:.5;cursor:default}
.ficha textarea,.ficha input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.ficha .chips button{font-weight:400;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.ficha details{font-size:14px}.ficha summary{cursor:pointer;color:var(--muted)}
@media (max-width:760px){.duo{grid-template-columns:1fr}.barra{grid-template-columns:110px 1fr 28px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Oficina virtual · La Nonna</h1>
      <p>Arras, bautizo y comunión a medida. Elige un departamento, mira quién trabaja en él y habla con cada persona.</p>
    </div>
    <nav class="links" aria-label="Accesos directos">
      <a href="https://docs.google.com/spreadsheets/d/1UufvOGiwFVzn7HEuwg6y54l5MrZDmX4fuDu85En5wY8/edit" target="_blank" rel="noopener">Hoja T4 2026</a>
      <a href="https://drive.google.com/drive/folders/1FtBib-KoabcZjQtU-z31vhQgJgVrli5W" target="_blank" rel="noopener">Facturas pendientes</a>
      <a href="https://drive.google.com/drive/folders/1awwchJnJt4aRXa1xJ2lEJxJXdjtT2sSg" target="_blank" rel="noopener">Emitidas pendientes</a>
    </nav>
  </header>

  <div class="floor" id="floor" role="group" aria-label="Departamentos"></div>

  <section class="scene" id="scene" aria-label="Plano de la oficina"></section>

  <section id="bandeja" aria-live="polite" hidden></section>

  <div class="main" id="mainGrid">
    <section class="panel" id="team" aria-live="polite"></section>
    <aside class="panel chat" id="chatPanel" aria-label="Chat"></aside>
  </div>
</div>

const $ = (s, el=document) => el.querySelector(s);
const chats = {};           // personId -> [{role, content}]
let sample = null;
let deptId = (location.hash || "").replace("#","");
const empiezaPilar = deptId === "pilar";

let personId = null;

const initials = n => n.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
const dept = () => DEPTS.find(d => d.id === deptId);
const allPeople = () => DEPTS.flatMap(d => d.people.map(p => ({...p, c:d.c, dept:d})));
const person = () => allPeople().find(p => p.id === personId);

function el(tag, attrs={}, text){
  const e = document.createElement(tag);
  for (const k in attrs){ if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (text != null) e.textContent = text;
  return e;
}

function renderFloor(){
  const f = $("#floor"); f.textContent = "";
  DEPTS.forEach(d => {
    const b = el("button", {class:"room", type:"button", "aria-pressed": String(modo === "oficina" && d.id === deptId), style:"--c:var(--"+d.c+")"});
    b.append(el("b", {}, d.name), el("span", {}, d.sub));
    b.onclick = () => { modo = "oficina"; deptId = d.id; personId = d.people[0].id; history.replaceState(null, "", "#"+d.id); renderAll(); };
    f.append(b);
  });
  const bp = el("button", {class:"room", type:"button", "aria-pressed": String(modo === "pilar"), style:"--c:var(--dir)"});
  bp.append(el("b", {}, "Panel de Pilar"), el("span", {}, "Decisiones y tareas"));
  bp.onclick = () => { modo = "pilar"; history.replaceState(null, "", "#pilar"); renderAll(); };
  f.append(bp);
}

function personCard(p, c){
  const b = el("button", {class:"person", type:"button", "aria-pressed": String(p.id === personId), style:"--c:var(--"+c+")"});
  const who = el("div", {class:"who"});
  const t = el("div"); t.append(el("b", {}, p.name), el("small", {}, p.role));
  who.append(el("div", {class:"avatar", "aria-hidden":"true"}, initials(p.name)), t);
  const ul = el("ul"); p.tasks.forEach(x => ul.append(el("li", {}, x)));
  b.append(who, ul, el("p", {class:"rep"}, p.rep), el("code", {class:"agent"}, "@"+p.agent));
  b.onclick = () => { personId = p.id; renderTeam(); renderChat(); };
  return b;
}

function renderTeam(){
  const d = dept(); const t = $("#team"); t.textContent = "";
  t.append(el("h2", {}, d.name), el("p", {class:"sub"}, d.blurb));
  if (d.org){
    const [dir, ...rest] = d.people;
    t.append(personCard(dir, d.c), el("div", {class:"org-link"}));
    if (rest.length === 1){ t.append(personCard(rest[0], d.c)); }
    else { const row = el("div", {class:"org-row"}); rest.forEach(p => row.append(personCard(p, d.c))); t.append(row); }
    if (d.rhythm){
      const r = el("div", {class:"rhythm"}); r.append(el("h3", {}, "Ritmo del equipo"));
      const dl = el("dl"); d.rhythm.forEach(([a,b]) => dl.append(el("dt", {}, a), el("dd", {}, b))); r.append(dl); t.append(r);
    }
    if (d.id === "contabilidad") t.append(bloqueExtracto());
  } else {
    const s = el("div", {class:"stack"}); d.people.forEach(p => s.append(personCard(p, d.c))); t.append(s);
  }
}

function addMsg(kind, text){
  const m = el("div", {class:"msg "+kind}, text); $("#log").append(m); $("#log").scrollTop = $("#log").scrollHeight; return m;
}

function renderChat(){
  const p = person(); const c = $("#chatPanel"); c.textContent = "";
  const head = el("div", {class:"chat-head", style:"--c:var(--"+p.c+")"});
  const w = el("div"); w.append(el("b", {}, p.name), el("small", {}, p.role));
  head.append(el("div", {class:"avatar", "aria-hidden":"true"}, initials(p.name)), w);
  const log = el("div", {class:"log", id:"log", role:"log", "aria-live":"polite"});
  c.append(head, log);
  addMsg("ellos", "Hola, soy " + p.name.split(" ")[0] + (sample ? ". ¿Qué necesitas?" : "."));
  (chats[p.id] || []).forEach(m => addMsg(m.role === "user" ? "yo" : "ellos", m.content));
  if (!sample){
    addMsg("aviso", "El chat no está disponible en esta vista. Para hablar con el agente, escribe @" + p.agent + " en Claude Code.");
    return;
  }
  const chips = el("div", {class:"chips"});
  p.prompts.forEach(q => { const b = el("button", {type:"button"}, q); b.onclick = () => send(q); chips.append(b); });
  const form = el("form", {class:"send", id:"sendForm"});
  const ta = el("textarea", {id:"msgInput", rows:"2", placeholder:"Escribe a " + p.name.split(" ")[0] + "…", "aria-label":"Mensaje"});
  const go = el("button", {type:"submit", id:"sendBtn"}, "Enviar");
  form.append(ta, go);
  form.onsubmit = e => { e.preventDefault(); const v = ta.value.trim(); if (v) { ta.value = ""; send(v); } };
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } });
  const n = el("p", {class:"note"}); n.append("Este chat sirve para planificar, redactar y aclarar dudas. Para que trabaje sobre Drive y la hoja, llámale en Claude Code: ");
  n.append(el("code", {}, "@" + p.agent)); n.append(".");
  c.append(chips, form, n);
}

async function send(text){
  if (busy || !sample) return;
  const p = person(); const hist = (chats[p.id] = chats[p.id] || []);
  hist.push({role:"user", content:text}); addMsg("yo", text);
  const bubble = addMsg("ellos", "…");
  const input = hist.map((m, i) => i === 0 ? {role:"user", content: p.persona + "\n\n" + FACTS + "\n\n---\nMensaje de la dueña:\n" + m.content} : m);
  busy = true; const btn = $("#sendBtn"); if (btn) btn.disabled = true;
  try {
    const r = await sample(input, { cache:false, onText: ({text}) => { bubble.textContent = text; $("#log").scrollTop = $("#log").scrollHeight; } });
    const out = (r && r.text) ? r.text : bubble.textContent;
    bubble.textContent = out; hist.push({role:"assistant", content: out});
  } catch (err) {
    hist.pop();
    bubble.className = "msg aviso";
    bubble.textContent = err && err.code === "not_granted" ? "Para chatear, permite que la página consulte a Claude cuando te lo pida."
      : err && err.code === "rate_limited" ? "Demasiadas preguntas seguidas. Espera un momento y vuelve a intentarlo."
      : "No he podido responder. Inténtalo de nuevo.";
  } finally {
    busy = false; const b2 = $("#sendBtn"); if (b2) b2.disabled = false;
  }
}

const EXTRACTOS_FOLDER = "106soLlTKZT5tEYSpQlsKTWx9d5VvhtNP";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MIMES = {".csv":"text/csv", ".pdf":"application/pdf", ".xlsx":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", ".xls":"application/vnd.ms-excel", ".txt":"text/plain", ".ofx":"application/x-ofx"};
let mcp = null;

function mesesDisponibles(){
  const out = []; const hoy = new Date();
  for (let i = 1; i <= 4; i++){ const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    out.push({v: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), t: MESES[d.getMonth()] + " " + d.getFullYear()}); }
  return out;
}
const aBase64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ko(r.error); r.readAsDataURL(f); });

function mensajeError(e){
  const c = e && e.code;
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required" || c === "not_granted") return "No has permitido que esta página use tu Google Drive. Vuelve a pulsar el botón y acepta el permiso.";
  if (c === "server_not_connected" || c === "selection_required") return "Google Drive no está conectado en tu cuenta de Claude. Conéctalo en Ajustes → Conectores.";
  if (c === "needs_reauth") return "La conexión con Google Drive ha caducado. Vuelve a conectarla en Ajustes → Conectores.";
  if (c === "blocked_by_policy") return "Tu organización no permite subir archivos a Drive desde aquí. Súbelo a mano a la carpeta.";
  if (c === "server_unavailable" || c === "upstream_error") return "Drive no ha contestado. Comprueba la carpeta antes de volver a intentarlo, por si el archivo ya se ha subido.";
  return "Drive no ha aceptado el archivo. Prueba a subirlo a mano a la carpeta.";
}

async function listarExtractos(ul, estado){
  try{
    const r = await mcp.callTool("Google Drive", "search_files", {query: "parentId = '" + EXTRACTOS_FOLDER + "'", excludeContentSnippets: true, pageSize: 30}, {cache: false});
    const files = ((r.payload && r.payload.files) || []).slice().sort((a, b) => String(b.createdTime).localeCompare(String(a.createdTime))).slice(0, 8);
    ul.textContent = "";
    if (!files.length){ estado.textContent = "La carpeta está vacía."; return; }
    estado.textContent = "";
    files.forEach(f => { const li = el("li"); const d = new Date(f.createdTime); li.textContent = f.title + (isNaN(d) ? "" : " · " + d.toLocaleDateString("es-ES")); ul.append(li); });
  } catch (e){ estado.className = "estado mal"; estado.textContent = mensajeError(e); }
}

function bloqueExtracto(){
  const box = el("section", {class:"extracto", "aria-label":"Extracto del banco"});
  box.append(el("h3", {}, "Extracto del banco"));
  const nota = el("p", {}, "Sube aquí el extracto de ingresos del mes. Se guarda en Drive, en CONCILIACIÓN > Extractos del banco, y de ahí lo coge Iván.");
  box.append(nota);
  const enlace = el("a", {href:"https://drive.google.com/drive/folders/" + EXTRACTOS_FOLDER, target:"_blank", rel:"noopener"}, "Abrir la carpeta en Drive");
  if (!mcp){

function parseFecha(s){

  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return new Date(+(m[3].length === 2 ? "20" + m[3] : m[3]), +m[2] - 1, +m[1]);
  return null;
}

/* ---------- Oficina isométrica ---------- */
const W = 17, H = 13, S = 34, OX = H*0.866*S + 30, OY = 120;
const P = (x, y, z) => [OX + (x - y) * 0.866 * S, OY + (x + y) * 0.5 * S - z * S];
const pts = a => a.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
const poly = (a, fill, extra="") => '<polygon points="' + pts(a) + '" fill="' + fill + '" ' + extra + '/>';
function box(x, y, z, w, d, h, c){
  return poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)], c.l)
       + poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)], c.r)
       + poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)], c.t);
}

const TAG = {carla:"Directora", nerea:"Comunicación", alvaro:"Director", ivan:"Contable", sofia:"Pedidos", hugo:"Compras", clara:"Triaje", marta:"Capacidad", lucia:"Citas", paula:"Seguimiento", diego:"Incidencias"};
const SPOT = {carla:[1.4,1.0,2.4], nerea:[6.2,1.0,2.4], alvaro:[1.2,6.0,2.2], ivan:[4.2,6.0,2.2], clara:[8.2,6.0,2.2], marta:[11.0,6.0,2.2], lucia:[13.8,6.0,2.2], sofia:[8.2,9.8,2.2], paula:[11.0,9.8,2.2], diego:[13.8,9.8,2.2], hugo:[1.4,10.2,2.4]};
const RUGS = {direccion:[0.6,0.5,4.8,3.9], comunicacion:[5.4,0.5,9.6,3.9], contabilidad:[0.6,5.2,7.2,9.4], ventas:[7.8,5.5,16.4,12.5], compras:[0.6,9.8,4.8,12.4]};
const DCOLOR = {direccion:"dir", comunicacion:"com", contabilidad:"cont", ventas:"ate", compras:"comp"};

function plant(x, y){
  const [fx, fy] = P(x + .3, y + .3, 1.0);
  return box(x, y, 0, .6, .6, .5, POT)
    + '<ellipse cx="' + fx.toFixed(1) + '" cy="' + (fy-4).toFixed(1) + '" rx="15" ry="13" fill="#3f8f5c"/>'
    + '<ellipse cx="' + (fx-5).toFixed(1) + '" cy="' + (fy-9).toFixed(1) + '" rx="9" ry="8" fill="#58b077"/>';
}

let TAGS = [];
function workstation(id, person, color){
  const [dx, dy, w] = SPOT[id]; const cx = dx + w / 2; const sk = LOOK[id][0], hr = LOOK[id][1];
  const sh = shirt(color);
  let g = box(dx + .12, dy + .1, 0, .08, .8, .68, LEG) + box(dx + w - .2, dy + .1, 0, .08, .8, .68, LEG)
    + box(dx, dy, .68, w, 1.0, .08, WOOD)
    + box(cx - .1, dy + .25, .76, .2, .2, .12, LEG) + box(cx - .5, dy + .22, .86, 1.0, .1, .6, MON)
    + box(cx - .42, dy + .55, .76, .84, .26, .03, KEY)
    + box(cx - .06, dy + 1.38, 0, .12, .12, .42, CHAIR) + box(cx - .4, dy + 1.12, .42, .8, .72, .1, CHAIR)
    + box(cx - .3, dy + 1.28, .52, .6, .42, .8, sh)
    + box(cx - .4, dy + 1.76, .5, .8, .1, .55, CHAIR);
  const [hx, hy] = P(cx, dy + 1.5, 1.72);
  g += '<circle cx="' + hx.toFixed(1) + '" cy="' + (hy - 2).toFixed(1) + '" r="11" fill="' + hr + '"/>'
     + '<circle cx="' + hx.toFixed(1) + '" cy="' + (hy + 1).toFixed(1) + '" r="9.5" fill="' + sk + '"/>'
     + '<ellipse cx="' + hx.toFixed(1) + '" cy="' + (hy - 5).toFixed(1) + '" rx="10.5" ry="6" fill="' + hr + '"/>';
  const label = person.name.split(" ")[0] + " · " + TAG[id];
  const tw = Math.round(label.length * 6.6 + 18);
  const ty = hy - 44;
  const sel = person.id === personId;
  const g2 = '<g class="char' + (sel ? " sel" : "") + '" data-p="' + id + '" tabindex="0" role="button" aria-label="Hablar con ' + person.name + ', ' + person.role + '" style="--tc:' + color + '">'
    + g
    + (sel ? '<ellipse cx="' + P(cx, dy + 1.5, 0)[0].toFixed(1) + '" cy="' + (P(cx, dy + 1.5, 0)[1] + 8).toFixed(1) + '" rx="42" ry="13" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-dasharray="5 4"/>' : '')
    + '</g>';
  TAGS.push('<g class="char tagg' + (sel ? " sel" : "") + '" data-p="' + id + '" style="--tc:' + color + '"><g class="tag"><rect class="tagbox" x="' + (hx - tw / 2).toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + tw + '" height="24" rx="12"/>'
    + '<text class="tagtxt" x="' + hx.toFixed(1) + '" y="' + (ty + 16).toFixed(1) + '" text-anchor="middle">' + label + '</text></g></g>');
  return g2;
}

function renderScene(){
  const people = {}; DEPTS.forEach(d => d.people.forEach(p => people[p.id] = {p, d}));
  let svg = '<svg viewBox="0 0 960 640" role="group" aria-label="Oficina isométrica con el equipo de La Nonna">';
  // suelo y paredes
  svg += poly([P(0,H,0),P(W,H,0),P(W,H,-.5),P(0,H,-.5)], "#c9b592") + poly([P(W,0,0),P(W,H,0),P(W,H,-.5),P(W,0,-.5)], "#b4a07c")
       + poly([P(0,0,0),P(W,0,0),P(W,H,0),P(0,H,0)], "#ecdcc0")
       + poly([P(0,0,0),P(W,0,0),P(W,0,3.4),P(0,0,3.4)], "#ebe4d8") + poly([P(0,0,0),P(0,H,0),P(0,H,3.4),P(0,0,3.4)], "#d9cfbd")
       + poly([P(0,0,0),P(W,0,0),P(W,0,.25),P(0,0,.25)], "#b9a98f") + poly([P(0,0,0),P(0,H,0),P(0,H,.25),P(0,0,.25)], "#a99978");
  // ventanas (pared del fondo derecho) y pizarra
  [[2.0,3.6],[5.6,7.2],[9.2,10.8],[14.6,16.2]].forEach(w => { svg += poly([P(w[0],0,1.2),P(w[1],0,1.2),P(w[1],0,2.9),P(w[0],0,2.9)], "#bfe3f7", 'stroke="#f6f3ec" stroke-width="3"'); });
  svg += poly([P(11.6,0,1.1),P(14.0,0,1.1),P(14.0,0,2.7),P(11.6,0,2.7)], "#fbfbfd", 'stroke="#b9a98f" stroke-width="3"');
  // alfombras por departamento
  Object.keys(RUGS).forEach(id => {
    const r = RUGS[id], c = COLORS[DCOLOR[id]], on = id === deptId;
    svg += poly([P(r[0],r[1],.01),P(r[2],r[1],.01),P(r[2],r[3],.01),P(r[0],r[3],.01)], c, 'fill-opacity="' + (on ? .26 : .12) + '" stroke="' + c + '" stroke-opacity="' + (on ? .9 : .35) + '" stroke-width="' + (on ? 2.5 : 1.2) + '"');
  });
  // sala de reuniones
  const rr = [10.2,0.5,14.4,5.4];
  svg += poly([P(rr[0],rr[1],.01),P(rr[2],rr[1],.01),P(rr[2],rr[3],.01),P(rr[0],rr[3],.01)], "#8f98b3", 'fill-opacity=".16" stroke="#8f98b3" stroke-opacity=".5" stroke-width="1.2"');
  const items = []; TAGS = [];
  items.push({k: 12.6 + 3.2, svg: box(11.3,1.8,.68,2.8,1.5,.1,TABLE) + box(11.6,2.0,0,.12,.12,.68,LEG) + box(13.6,2.0,0,.12,.12,.68,LEG) + box(11.6,2.9,0,.12,.12,.68,LEG) + box(13.6,2.9,0,.12,.12,.68,LEG)});
  [[11.5,1.2],[12.6,1.2],[13.4,1.2],[11.5,3.5],[12.6,3.5],[13.4,3.5]].forEach(c => items.push({k: c[0]+c[1]+.3, svg: box(c[0]-.25,c[1]-.25,.4,.55,.55,.1,CHAIR) + box(c[0]-.05,c[1]-.05,0,.1,.1,.4,LEG)}));
  const [lx, ly] = P(12.4, 4.9, 0);
  items.push({k: 99, svg: '<text class="zlabel" x="' + lx.toFixed(0) + '" y="' + ly.toFixed(0) + '" text-anchor="middle">REUNIONES</text>'});
  [[5.1,4.0],[0.5,12.4],[16.4,12.6],[7.1,12.2],[7.3,4.6]].forEach(c => items.push({k: c[0]+c[1], svg: plant(c[0], c[1])}));
  // glass
  items.push({k: 5.1 + 2, svg: box(5.0,.6,0,.05,3.2,1.5,{t:"rgba(180,215,235,.55)",l:"rgba(160,200,225,.45)",r:"rgba(140,185,215,.45)"})});
  Object.keys(SPOT).forEach(id => { const o = people[id]; items.push({k: SPOT[id][0] + SPOT[id][2] / 2 + SPOT[id][1] + 1, svg: workstation(id, o.p, COLORS[o.d.c])}); });
  items.sort((a, b) => a.k - b.k).forEach(i => svg += i.svg);
  TAGS.forEach(t => svg += t);
  svg += '</svg>';
  const sc = $("#scene"); sc.innerHTML = svg + '<p class="scene-cap">Haz clic en una persona para ver su trabajo y hablar con ella.</p>';
  sc.querySelectorAll(".char").forEach(g => {
    const go = () => { const o = people[g.dataset.p]; modo = "oficina"; deptId = o.d.id; personId = o.p.id; history.replaceState(null, "", "#" + deptId); renderAll(); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
  });
}

function renderAll(){ if (modo === "pilar"){ renderScene(); renderFloor(); renderBandeja(); return; } if (!personId || !dept().people.some(p => p.id === personId)) personId = dept().people[0].id; renderScene(); renderFloor(); renderTeam(); renderChat(); renderBandeja(); }
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if (h === "pilar" && modo !== "pilar"){ modo = "pilar"; renderAll(); return; } if (DEPTS.some(d => d.id === h) && h !== deptId){ deptId = h; personId = null; renderAll(); } });
if (empiezaPilar) modo = "pilar";
renderAll();
(async () => { try { sample = await window.claude?.use("sample"); } catch (e) { sample = null; } if (sample){ if (modo !== "pilar") renderChat(); } })();
(async () => { try { mcp = await window.claude?.use("mcp"); } catch (e) { mcp = null; } if (mcp){ if (modo === "pilar" || deptId === "ventas") renderBandeja(); else if (deptId === "contabilidad") renderTeam(); } })();
</script>

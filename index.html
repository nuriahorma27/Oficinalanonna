<title>Oficina virtual · La Nonna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Young+Serif&display=swap">
<style>
/* Plano de oficina: una fila de departamentos arriba; debajo, el equipo en organigrama a la izquierda y el chat de la persona elegida a la derecha. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --ink:#1b2233; --muted:#5b6679; --line:#dbe0ea; --soft:#e9ecf3;
  --dir:#5b4bd1; --com:#b4423a; --cont:#17775a; --ate:#a46a0c; --comp:#1f62a8;
  --on-accent:#ffffff;
  --font-display:"Young Serif", Georgia, "Times New Roman", serif;
  --font-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --surface:#1a1f2b; --ink:#eceff6; --muted:#9aa5b8; --line:#2b3345; --soft:#232a39;
    --dir:#9d92ff; --com:#ff8b80; --cont:#5fcfa6; --ate:#e7b155; --comp:#79b4f0;
    --on-accent:#10131a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#1a1f2b; --ink:#eceff6; --muted:#9aa5b8; --line:#2b3345; --soft:#232a39;
  --dir:#9d92ff; --com:#ff8b80; --cont:#5fcfa6; --ate:#e7b155; --comp:#79b4f0;
  --on-accent:#10131a; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:24px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500}
.links a:hover,.links a:focus-visible{border-color:var(--ink)}
.floor{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.room{--c:var(--dir);text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);
  border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.room b{font-weight:600;font-size:15px}
.room span{color:var(--muted);font-size:13px}
.room[aria-pressed="true"]{outline:2px solid var(--c);outline-offset:1px;background:var(--soft)}
.room:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
h2{font-family:var(--font-display);font-weight:400;font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.person{--c:var(--dir);position:relative;display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.person[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.person:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.who{display:flex;gap:12px;align-items:center}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.02em}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:13px}
.agent{font-family:var(--font-mono);font-size:12px;color:var(--c);margin-top:8px;display:block}
.person ul{margin:10px 0 0;padding-left:18px;color:var(--ink);font-size:14px}
.person li{margin:2px 0}
.person .rep{margin:10px 0 0;color:var(--muted);font-size:13px}
.org-link{position:relative;height:16px}
.org-link::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line)}
.org-row{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px}
.org-row::before{content:"";position:absolute;top:0;left:25%;right:25%;border-top:2px solid var(--line)}
.org-row>.person::before{content:"";position:absolute;top:-16px;left:50%;height:16px;border-left:2px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:12px}
.rhythm{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.rhythm h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.rhythm dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:14px}
.rhythm dt{font-family:var(--font-mono);font-size:12px;color:var(--cont);padding-top:2px}
.rhythm dd{margin:0}
.chat{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(16px, env(safe-area-inset-top, 0px))}
.chat-head{display:flex;gap:12px;align-items:center;--c:var(--dir)}
.chat-head .avatar{width:40px;height:40px;font-size:14px}
.chat-head b{display:block;font-weight:600}
.chat-head small{color:var(--muted);font-size:13px}
.log{height:min(46vh,400px);min-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.msg.yo{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.ellos{align-self:flex-start;background:var(--soft)}
.msg.aviso{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--ink)}
form.send{display:flex;gap:8px}
form.send textarea{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical;min-height:44px;max-height:160px}
form.send textarea:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
form.send button{font:inherit;font-weight:600;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
form.send button:disabled{opacity:.5;cursor:default}
.note{color:var(--muted);font-size:12.5px;margin:0}
.note code{font-family:var(--font-mono);font-size:12px}

.scene{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 4px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:640px}
.scene .char{cursor:pointer;outline:none}
.scene .char:focus-visible .tagbox{stroke-width:3}
.scene .tagbox{fill:#ffffff;stroke:var(--tc);stroke-width:1.5}
.scene .tagtxt{font-family:var(--font-body);font-size:12.5px;font-weight:600;fill:#1b2233}
.scene .char.sel .tagbox{fill:var(--tc)}
.scene .char.sel .tagtxt{fill:#ffffff}
.scene .char:hover .tagbox{stroke-width:2.5}
.scene .zlabel{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;fill:#7b6a55}
.scene-cap{margin:6px 8px 6px;color:var(--muted);font-size:13px}
@media (max-width:700px){ .scene .char:not(.sel) .tag{display:none} }

.extracto{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.extracto h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.extracto p{margin:0;font-size:14px}
.extracto .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.extracto select,.extracto input[type=file]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
.extracto button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.extracto button.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.extracto button:disabled{opacity:.5;cursor:default}
.extracto .estado{min-height:1.4em;color:var(--muted);font-size:13.5px}
.extracto .estado.ok{color:var(--cont)}
.extracto .estado.mal{color:var(--com)}
.extracto ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink)}
.extracto a{color:var(--ink)}
@media (max-width:900px){
  .floor{grid-template-columns:repeat(2,minmax(0,1fr))}
  .main{grid-template-columns:minmax(0,1fr)}
  .chat{position:static}
}
@media (max-width:560px){
  .org-row{grid-template-columns:1fr}
  .org-row::before,.org-row>.person::before{display:none}
}

.floor{grid-template-columns:repeat(5,minmax(0,1fr))}
#bandeja{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
#bandeja[hidden],.main[hidden]{display:none}
.bandeja-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:start;justify-content:space-between;margin-bottom:8px}
.bandeja-cab>div{flex:1 1 280px}
.bandeja-cab button,.prop button,.minichat+textarea+button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.bandeja-cab button.sec,.prop button.sec{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.prop button.ok{background:var(--cont);border-color:var(--cont);color:#fff}
.prop button:disabled{opacity:.5;cursor:default}
.enl{color:var(--ink);font-size:14px;padding:8px 4px}
.lista{display:flex;flex-direction:column;gap:14px}
.lista h3,#bandeja h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;font-weight:600}
.lista h4,.prop h4{font-size:13px;margin:12px 0 4px;color:var(--muted);font-weight:600}
.prop{border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:10px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.prop-cab{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.prop-cab b{display:block;font-weight:600}
.prop-cab small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.ins{display:flex;flex-wrap:wrap;gap:6px;align-items:start}
.ins-i{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.prop details{font-size:14px}
.prop summary{cursor:pointer;color:var(--muted)}
.orig{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0 0;max-height:240px;overflow:auto}
.borrador,.prop textarea,.prop input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.borrador[readonly]{background:var(--soft)}
.motivo,.cuenta,.vacio{margin:0;color:var(--muted);font-size:13.5px}
.cuenta{color:var(--ink);font-weight:600}
.acciones,.zona{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.zona{flex-direction:column;align-items:stretch}
.zona>button{align-self:flex-start}
.minichat .msg{max-width:100%}
.nota{margin:0;color:var(--muted);font-size:13px}
#bandeja .estado{margin:0;min-height:1.2em;color:var(--muted);font-size:13.5px}
#bandeja .estado.ok{color:var(--cont)}
#bandeja .estado.mal{color:var(--com)}
.corta{margin:0;padding-left:18px;font-size:14px}
.gente{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gp{font:inherit;color:inherit;text-align:left;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--ate);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column}
.gp small{color:var(--muted);font-size:12.5px}.gp .n{margin-top:4px;font-size:13px;font-weight:600}
.quien{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.quien dt{font-family:var(--font-mono);font-size:12px;color:var(--muted);padding-top:3px}.quien dd{margin:0}
.enl-b{font:inherit;font-size:14px;font-weight:600;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
@media (max-width:900px){.floor{grid-template-columns:repeat(2,minmax(0,1fr))}.gente{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gente{grid-template-columns:1fr}.quien{grid-template-columns:1fr}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 12px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.kpi b{font-family:var(--font-display);font-weight:400;font-size:1.7rem;line-height:1}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.ambar{border-color:var(--ate)}.kpi.rojo b{color:var(--com)}.kpi.verde b{color:var(--cont)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{font:inherit;font-size:14px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ate)}
.duo{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:14px;align-items:start}
.correos{display:flex;flex-direction:column;gap:6px}
.corr{font:inherit;color:inherit;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.corr b{font-weight:600;font-size:14px}.corr small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.corr .mini{font-size:12px;color:var(--muted)}
.corr.u3{border-left-color:var(--com)}.corr.u2{border-left-color:var(--ate)}.corr.u1{border-left-color:var(--cont)}
.corr[aria-pressed="true"]{background:var(--soft);box-shadow:0 0 0 2px var(--ink)}
.ficha{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.ficha-cab{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
#bandeja .ficha h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.25rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.ficha small{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.asunto{margin:2px 0 0;font-weight:600;font-size:14px}
.chips-f{display:flex;gap:6px;flex-wrap:wrap;align-items:start}
.chp{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface)}
.chp.u3{border-color:var(--com);color:var(--com)}.chp.u2{border-color:var(--ate);color:var(--ate)}.chp.u1,.chp.okc{border-color:var(--cont);color:var(--cont)}
.resumen{margin:0}
.datos{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0;font-size:14px}
.datos dt{color:var(--muted);font-size:12.5px;padding-top:2px}.datos dd{margin:0}.datos dd.aviso{color:var(--com);font-weight:600}
.avisos{margin:0;padding:10px 12px 10px 28px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:8px;font-size:13.5px}
.avisos li{margin:3px 0}
.hist{margin:0;padding-left:18px;font-size:13.5px}.hist li{margin:2px 0}
.aviso-b{margin:0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ate);border-radius:8px;font-size:14px}
.barras{display:flex;flex-direction:column;gap:6px}
.barra{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;font-size:13.5px}
.barra i{display:block;height:10px;background:var(--ate);border-radius:5px;min-width:3px}.barra i.ruido{background:var(--muted)}
.barra em{font-style:normal;color:var(--muted)}
.semanas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.sem{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);display:flex;flex-direction:column}
.sem small{color:var(--muted);font-size:11.5px}.sem b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.1}.sem span{font-size:11.5px;color:var(--muted)}
.sem.casi{border-color:var(--ate);background:var(--soft)}.sem.llena{border-color:var(--com);background:var(--soft)}.sem.llena b{color:var(--com)}
.scroll-x{overflow-x:auto}
.tabla{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
.tabla th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tabla td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.tabla td.mal{color:var(--com);font-weight:600}
.ajustes .aj{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.ajustes label{flex:1 1 260px;font-size:14px}.ajustes input{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;flex:0 1 260px}
.ajustes button,.ficha button.sec{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
.ficha button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.ficha button.ok{background:var(--cont);border-color:var(--cont);color:#fff}
.ficha button:disabled{opacity:.5;cursor:default}
.ficha textarea,.ficha input[type=text]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical}
.ficha .chips button{font-weight:400;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.ficha details{font-size:14px}.ficha summary{cursor:pointer;color:var(--muted)}
@media (max-width:760px){.duo{grid-template-columns:1fr}.barra{grid-template-columns:110px 1fr 28px}}

.modos{display:flex;gap:8px;flex-wrap:wrap}
.modos button{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.modos button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{font-family:var(--font-mono);font-size:12px;background:var(--com);color:#fff;border-radius:999px;padding:1px 8px}
.badge[hidden]{display:none}
#trabajo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
#trabajo[hidden]{display:none}
#trabajo .lista h3,#trabajo h3.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;font-weight:600}
#trabajo .bandeja-cab button,#bandeja .bandeja-cab button{font:inherit;font-size:14px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink)}
#trabajo .estado{margin:0;min-height:1.2em;color:var(--muted);font-size:13.5px}#trabajo .estado.ok{color:var(--cont)}#trabajo .estado.mal{color:var(--com)}
#trabajo .ficha h3{font-family:var(--font-display);font-weight:400;font-size:1.25rem;text-transform:none;letter-spacing:0;color:var(--ink);margin:0}

async function send(text){
  if (busy || !sample) return;
  const p = person(); const hist = (chats[p.id] = chats[p.id] || []);
  hist.push({role:"user", content:text}); addMsg("yo", text);
  const bubble = addMsg("ellos", "…");
  const input = hist.map((m, i) => i === 0 ? {role:"user", content: p.persona + "\n\n" + FACTS + "\n\n---\nMensaje de la dueña:\n" + m.content} : m);
  busy = true; const btn = $("#sendBtn"); if (btn) btn.disabled = true;
  try {
    const r = await sample(input, { cache:false, onText: ({text}) => { bubble.textContent = text; $("#log").scrollTop = $("#log").scrollHeight; } });
    const out = (r && r.text) ? r.text : bubble.textContent;
    bubble.textContent = out; hist.push({role:"assistant", content: out});
  } catch (err) {
    hist.pop();
    bubble.className = "msg aviso";
    bubble.textContent = err && err.code === "not_granted" ? "Para chatear, permite que la página consulte a Claude cuando te lo pida."
      : err && err.code === "rate_limited" ? "Demasiadas preguntas seguidas. Espera un momento y vuelve a intentarlo."
      : "No he podido responder. Inténtalo de nuevo.";
  } finally {
    busy = false; const b2 = $("#sendBtn"); if (b2) b2.disabled = false;
  }
}

const EXTRACTOS_FOLDER = "106soLlTKZT5tEYSpQlsKTWx9d5VvhtNP";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MIMES = {".csv":"text/csv", ".pdf":"application/pdf", ".xlsx":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", ".xls":"application/vnd.ms-excel", ".txt":"text/plain", ".ofx":"application/x-ofx"};
let mcp = null;

function mesesDisponibles(){
  const out = []; const hoy = new Date();
  for (let i = 1; i <= 4; i++){ const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    out.push({v: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"), t: MESES[d.getMonth()] + " " + d.getFullYear()}); }
  return out;
}
const aBase64 = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ko(r.error); r.readAsDataURL(f); });

function mensajeError(e){
  const c = e && e.code;
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required" || c === "not_granted") return "No has permitido que esta página use tu Google Drive. Vuelve a pulsar el botón y acepta el permiso.";
  if (c === "server_not_connected" || c === "selection_required") return "Google Drive no está conectado en tu cuenta de Claude. Conéctalo en Ajustes → Conectores.";
  if (c === "needs_reauth") return "La conexión con Google Drive ha caducado. Vuelve a conectarla en Ajustes → Conectores.";
  if (c === "blocked_by_policy") return "Tu organización no permite subir archivos a Drive desde aquí. Súbelo a mano a la carpeta.";
  if (c === "server_unavailable" || c === "upstream_error") return "Drive no ha contestado. Comprueba la carpeta antes de volver a intentarlo, por si el archivo ya se ha subido.";
  return "Drive no ha aceptado el archivo. Prueba a subirlo a mano a la carpeta.";
}

async function listarExtractos(ul, estado){
  try{
    const r = await mcp.callTool("Google Drive", "search_files", {query: "parentId = '" + EXTRACTOS_FOLDER + "'", excludeContentSnippets: true, pageSize: 30}, {cache: false});
    const files = ((r.payload && r.payload.files) || []).slice().sort((a, b) => String(b.createdTime).localeCompare(String(a.createdTime))).slice(0, 8);
    ul.textContent = "";
    if (!files.length){ estado.textContent = "La carpeta está vacía."; return; }
    estado.textContent = "";
    files.forEach(f => { const li = el("li"); const d = new Date(f.createdTime); li.textContent = f.title + (isNaN(d) ? "" : " · " + d.toLocaleDateString("es-ES")); ul.append(li); });
  } catch (e){ estado.className = "estado mal"; estado.textContent = mensajeError(e); }
}

function bloqueExtracto(){
  const box = el("section", {class:"extracto", "aria-label":"Extracto del banco"});
  box.append(el("h3", {}, "Extracto del banco"));
  const nota = el("p", {}, "Sube aquí el extracto de ingresos del mes. Se guarda en Drive, en CONCILIACIÓN > Extractos del banco, y de ahí lo coge Iván.");
  box.append(nota);
  const enlace = el("a", {href:"https://drive.google.com/drive/folders/" + EXTRACTOS_FOLDER, target:"_blank", rel:"noopener"}, "Abrir la carpeta en Drive");
  if (!mcp){
    const p = el("p", {}); p.append("Desde esta vista no puedo subirlo por ti. Súbelo a mano: "); p.append(enlace); p.append(".");
    box.append(p); return box;
  }
  const fila = el("div", {class:"fila"});
  const sel = el("select", {id:"mesExtracto", "aria-label":"Mes del extracto"});
  mesesDisponibles().forEach(m => sel.append(el("option", {value:m.v}, m.t)));
  const file = el("input", {type:"file", id:"archivoExtracto", accept:".csv,.xlsx,.xls,.pdf,.ofx,.txt", "aria-label":"Archivo del extracto"});
  const subir = el("button", {type:"button", id:"subirExtracto"}, "Subir extracto");
  fila.append(sel, file, subir); box.append(fila);
  const estado = el("p", {class:"estado", id:"estadoExtracto", role:"status", "aria-live":"polite"});
  const ul = el("ul", {id:"listaExtractos"});
  const ver = el("button", {type:"button", class:"sec"}, "Ver los ya subidos");
  const f2 = el("div", {class:"fila"}); f2.append(ver, enlace);
  box.append(estado, f2, ul);
  ver.onclick = () => { estado.className = "estado"; estado.textContent = "Mirando la carpeta…"; listarExtractos(ul, estado); };
  subir.onclick = async () => {
    const f = file.files && file.files[0];
    if (!f){ estado.className = "estado mal"; estado.textContent = "Elige primero el archivo del extracto."; return; }
    subir.disabled = true; estado.className = "estado"; estado.textContent = "Subiendo…";
    const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [""])[0].toLowerCase();
    const seguro = f.name.replace(/[^A-Za-z0-9._-]+/g, "_");
    const tipo = f.type || MIMES[ext] || "application/octet-stream";
    const base = {title: sel.value + "_extracto-ingresos_" + seguro, parentId: EXTRACTOS_FOLDER, contentMimeType: tipo, disableConversionToGoogleType: true};
    try{
      let lt = null; try { lt = await mcp.listTools(); } catch (e) { lt = null; }
      let usado = "inline";
      let input = Object.assign({}, base);
      if (lt && lt.fileArgs){ input.base64Content = {$file: {data: f, name: seguro, type: tipo}}; usado = "file"; }
      else if (f.size <= 700000){ input.base64Content = await aBase64(f); }
      else { throw {code: "demasiado_grande"}; }
      let r;
      try { r = await mcp.callTool("Google Drive", "create_file", input); }
      catch (e){
        if (usado === "file" && e && e.code === "bad_request" && f.size <= 700000){ input = Object.assign({}, base, {base64Content: await aBase64(f)}); r = await mcp.callTool("Google Drive", "create_file", input); }
        else throw e;
      }
      estado.className = "estado ok"; estado.textContent = "Subido: " + base.title + ". Ya se lo puede mirar Iván.";
      file.value = "";
      listarExtractos(ul, el("p"));
    } catch (e){
      estado.className = "estado mal";
      estado.textContent = e && e.code === "demasiado_grande" ? "El archivo es muy grande para subirlo desde aquí. Súbelo a mano a la carpeta de Drive." : mensajeError(e);
    } finally { subir.disabled = false; }
  };
  return box;
}

// Trae a la pestaña Entrada los correos nuevos de info@. Solo lee: no marca nada como leído.
async function traerCorreosNuevos(){
  const [en, pr, de, co] = await Promise.all([leerHoja("Entrada!A1:K3000"), leerHoja("Propuestas!A1:W3000"), leerHoja("Descartados!A1:D3000"), leerHoja("Contabilidad!A1:I3000")]);
  const vistos = new Set(); [en, pr, de, co].forEach(v => aFilas(v).forEach(f => { if (f["ID mensaje Gmail"]) vistos.add(f["ID mensaje Gmail"]); }));
  const r = await gmail("search_threads", {query: BUSQUEDA_INFO, pageSize: 40, view: "THREAD_VIEW_SUMMARY"});
  const hilos = (r.threads || []).filter(t => { const u = (t.messages || [])[0]; return u && !vistos.has(u.id) && !esNuestro(u); });
  let nuevos = 0;
  for (const t of hilos){
    const h = await gmail("get_thread", {threadId: t.id, messageFormat: "PLAIN_TEXT"});
    const ms = h.messages || []; const u = ms[ms.length - 1];
    if (!u || esNuestro(u) || vistos.has(u.id)) continue;
    const texto = limpiarCuerpo(u.plaintextBody || u.snippet, 3000); if (texto.length < 4) continue;
    const previos = ms.slice(0, -1).slice(-6).map(m => (esNuestro(m) ? "LA NONNA" : "CLIENTA") + " (" + String(m.date || "").slice(0, 16).replace("T", " ") + "): " + limpiarCuerpo(m.plaintextBody || m.snippet, 700)).join("\n\n");
    const q = remitente(u);
    await apuntarFila("Entrada", {"ID mensaje Gmail": u.id, Recibido: new Date().toISOString().slice(0, 16).replace("T", " "), De: q.de, Email: q.mail, Nombre: q.nombre, Asunto: String(u.subject || "").slice(0, 150), "Fecha correo": u.date || "", Texto: texto, Hilo: previos.slice(0, 4000), "Lista masiva": /no-?reply|donotreply|notifications?@|newsletter|mailer|news@/i.test(q.mail) ? "sí" : "no", Estado: "Sin preparar"});
    vistos.add(u.id); nuevos++;
  }
  return nuevos;
}

const vista = {tab: {}, sel: null};      // pestaña activa por persona y correo abierto
const D = {t: 0, prop: [], dec: [], con: [], des: [], ped: [], aj: {}};

async function cargarDatos(forzar){
  if (!forzar && Date.now() - D.t < 15000) return D;
  const [p, d, c, x, pe, aj] = await Promise.all([
    leerHoja("Propuestas!A1:W500"), leerHoja("Decisiones!A1:J300"), leerHoja("Consignas!A1:F100"),
    leerHoja("Descartados!A1:D300"), leerHoja("Pedidos activos!A1:L300"), leerHoja("Ajustes!A1:C20")
  ]);
  D.prop = aFilas(p).filter(o => o.ID); D.dec = aFilas(d); D.con = aFilas(c); D.des = aFilas(x); D.ped = aFilas(pe);
  D.aj = {}; aFilas(aj).forEach(r => { D.aj[r.Clave] = r.Valor; });
  D.t = Date.now(); return D;
}

/* utilidades */
function parseFecha(s){
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return new Date(+(m[3].length === 2 ? "20" + m[3] : m[3]), +m[2] - 1, +m[1]);
  return null;
}
const dias = f => f ? Math.round((f - HOY) / 864e5) : null;
const fmt = f => f ? f.toLocaleDateString("es-ES", {day:"numeric", month:"short", year:"numeric"}) : "";
const nivel = u => { const n = norm(u); return n.startsWith("alta") ? 3 : n.startsWith("media") ? 2 : n.startsWith("baja") ? 1 : 0; };
const nombreNivel = n => ["Sin valorar", "Baja", "Media", "Alta"][n];
const esPendiente = f => f.Estado === "Pendiente";
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
function lunes(f){ const d = new Date(f); d.setHours(0,0,0,0); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d; }

function boton(txt, cls, fn){ const b = el("button", {type:"button", class:cls || ""}, txt); if (fn) b.onclick = fn; return b; }
function chip(txt, cls){ return el("span", {class:"chp" + (cls ? " " + cls : "")}, txt); }
function kpi(n, txt, cls){ const k = el("div", {class:"kpi" + (cls ? " " + cls : "")}); k.append(el("b", {}, String(n)), el("span", {}, txt)); return k; }
function irA(d, p, id){ modo = "oficina"; deptId = d; personId = p; if (id) vista.sel = id; history.replaceState(null, "", "#" + d); renderAll(); }

const trad = new Map();
async function traducir(texto){
  if (trad.has(texto)) return trad.get(texto);
  const r = await sample("Traduce al español de España este correo, de forma fiel y natural, sin añadir nada ni explicar. Devuelve SOLO la traducción.\n\n" + texto, {cache: true});
  const t = (r && r.text) || ""; trad.set(texto, t); return t;
}
function bloqueTraduccion(f, ta, c){
  const esEs = (!f.Idioma || ["es", "espanol", "spanish"].includes(norm(f.Idioma))) && idiomaDe(ta.value) === "es";
  if (esEs) return;
  const caja = el("div", {class:"trad"});
  const salida = el("p", {class:"trad-txt", hidden:"hidden"});
  const est = el("span", {class:"estado"});
  const b = boton("Ver traducción al español", "sec", async () => {
    if (!sample){ est.className = "estado mal"; est.textContent = "La traducción no está disponible en esta vista."; return; }
    b.disabled = true; est.className = "estado"; est.textContent = "Traduciendo…";
    try { const t = await traducir(ta.value); salida.textContent = t; salida.hidden = false; est.textContent = ""; }
    catch (e){ est.className = "estado mal"; est.textContent = e && e.code === "not_granted" ? "Permite que la página consulte a Claude para traducir." : "No he podido traducirlo. Inténtalo otra vez."; }
    b.disabled = false;
  });
  caja.append(chip("Se contesta en " + (norm(f.Idioma) === "en" ? "inglés" : norm(f.Idioma) === "fr" ? "francés" : f.Idioma), "u2"), b, est, salida);
  c.append(caja);
}

/* ---------- Ficha completa de un correo, con sus botones ---------- */
function ficha(f, p, datos, alCambiar){
  const c = el("article", {class:"ficha"});
  const fc = parseFecha(f["Fecha ISO"]) || parseFecha(f["Fecha ceremonia"]); const dd = dias(fc);
  const cab = el("div", {class:"ficha-cab"});
  const t = el("div"); t.append(el("h3", {}, f.Clienta || f["Email clienta"] || "Sin nombre"), el("small", {}, (f["Email clienta"] || "") + (f.Idioma ? " · " + f.Idioma.toUpperCase() : "")), el("p", {class:"asunto"}, f.Asunto || ""));
  const ch = el("div", {class:"chips-f"});
  const u = nivel(f.Urgencia); ch.append(chip("Urgencia " + nombreNivel(u).toLowerCase(), "u" + u));
  if (f.Estado && f.Estado !== "Pendiente") ch.append(chip(f.Estado, "okc"));
  cab.append(t, ch); c.append(cab);
  if (f.Resumen){ c.append(el("h4", {}, "Qué quiere y en qué punto está"), el("p", {class:"resumen"}, f.Resumen)); }
  // datos
  const g = el("dl", {class:"datos"});
  const par = (k, v, cls) => { const a = el("dt", {}, k), b = el("dd", {class: cls || ""}); if (v instanceof Node) b.append(v); else b.textContent = v || "—"; g.append(a, b); };
  par("Ceremonia", fc ? fmt(fc) + (dd != null ? (dd >= 0 ? " · faltan " + dd + " días" : " · ya pasó") : "") : (f["Fecha ceremonia"] || "Sin fecha"), fc ? "" : "aviso");
  par("Prenda", f.Prenda); par("Pago", f.Pago); par("Nº de pedido", f.Pedido || "Sin número");
  par("Recibido", f.Recibido); par("Lo trata", f.Persona);
  c.append(g);
  // avisos automáticos
  const av = [];
  if (!fc) av.push("No consta la fecha de la ceremonia: no se puede confirmar nada hasta saberla.");
  if (fc && dd != null && dd >= 0 && dd <= 45 && fc.getFullYear() === 2026) av.push("La ceremonia es en menos de 6 semanas y el taller cierra en noviembre hasta el 5 de diciembre: consulta antes con Marta.");
  if (norm(f.Pago) === "sin pedido" || norm(f.Pago) === "pendiente") av.push("Pago por resolver: pídelo con el número de pedido en el concepto o el justificante.");
  if (f.Falta) av.push("Falta: " + f.Falta);
  if (f.Alerta) av.push("Ojo: " + f.Alerta);
  const vig = datos.con.filter(x => norm(x.Vigente) !== "no" && x.Consigna);
  vig.forEach(x => av.push("Consigna vigente: " + x.Consigna + (x["Hasta (fecha ceremonia)"] ? " (hasta " + x["Hasta (fecha ceremonia)"] + ")" : "")));
  if (av.length){ const ul = el("ul", {class:"avisos"}); av.forEach(a => ul.append(el("li", {}, a))); c.append(el("h4", {}, "Qué tener en cuenta"), ul); }
  // historial con la clienta
  const ant = datos.prop.filter(x => x.ID !== f.ID && x["Email clienta"] && norm(x["Email clienta"]) === norm(f["Email clienta"]));
  if (ant.length){
    c.append(el("h4", {}, "Otros correos de esta clienta"));
    const ul = el("ul", {class:"hist"}); ant.slice(-5).forEach(x => ul.append(el("li", {}, (x.Recibido || "") + " · " + (x.Asunto || "") + " · " + (x.Estado || ""))));
    c.append(ul);
  }
  const det = el("details"); const pre = el("pre", {class:"orig"}, f["Correo original"] || "");
  det.append(el("summary", {}, "Leer el correo de la clienta"), pre);
  if (f.Idioma && !["es", "espanol", "spanish"].includes(norm(f.Idioma)) && sample){
    const bt = boton("Traducir el correo de la clienta", "sec", async () => { bt.disabled = true; try { pre.textContent = (f["Correo original"] || "") + "\n\n— Traducción —\n" + await traducir(f["Correo original"] || ""); } catch (e){ bt.disabled = false; } });
    det.append(bt);
  }
  c.append(det);
  // respuesta y acciones
  c.append(el("h4", {}, "Respuesta propuesta por " + p.name.split(" ")[0]));
  const ta = el("textarea", {class:"borrador", rows:"11", readonly:"readonly", "aria-label":"Respuesta propuesta"}); ta.value = f["Respuesta final"] || f["Respuesta propuesta"] || "";
  c.append(ta);
  bloqueTraduccion(f, ta, c);
  if (f.Motivo) c.append(el("p", {class:"motivo"}, "Por qué le toca a " + p.name.split(" ")[0] + ": " + f.Motivo));
  const estado = el("p", {class:"estado", role:"status", "aria-live":"polite"});
  if (!esPendiente(f)){ c.append(el("p", {class:"motivo"}, "Ya está " + (f.Estado || "").toLowerCase() + "."), estado); return c; }
  const zona = el("div", {class:"zona"}); const fila = el("div", {class:"acciones"});
  const aceptar = async texto => {
    estado.className = "estado"; estado.textContent = "Guardando…";
    try {
      if (!(await mismaFila("Propuestas", f._fila, f.ID))){ estado.className = "estado mal"; estado.textContent = "Los datos han cambiado. Pulsa Actualizar y vuelve a mirarlo."; return; }
      const nota = await aprobarRespuesta(f, texto);
      D.t = 0; alCambiar(nota);
    } catch (e){ estado.className = "estado mal"; estado.textContent = mensajeHoja(e); }
  };
  fila.append(boton("Aceptar", "ok", () => aceptar(ta.value)), boton("Rechazar", "sec", () => abrirRechazo()), boton("Modificar", "sec", () => abrirModificar()));
  const cerrar = () => { zona.textContent = ""; ta.readOnly = true; ta.value = f["Respuesta propuesta"] || ""; fila.hidden = false; estado.textContent = ""; };
  function abrirModificar(){
    fila.hidden = true; ta.readOnly = false; ta.focus(); zona.textContent = "";
    zona.append(el("p", {class:"nota"}, "Cambia lo que haga falta en el texto de arriba y guarda."), boton("Guardar y aceptar", "ok", () => aceptar(ta.value)), boton("Cancelar", "sec", cerrar));
  }
  function abrirRechazo(previa){
    fila.hidden = true; zona.textContent = "";
    zona.append(el("p", {class:"msg ellos"}, "Vale, no la envío. ¿Qué tengo que contestar a " + (f.Clienta || "la clienta").split(" ")[0] + "?"));
    if (!sample){ zona.append(el("p", {class:"nota"}, "El chat no está disponible en esta vista. Usa Modificar y escribe tú la respuesta."), boton("Volver", "sec", cerrar)); return; }
    if (f.Opciones){ const o = el("div", {class:"chips"}); f.Opciones.split("|").map(x => x.trim()).filter(Boolean).forEach(x => o.append(boton(x, "", () => { inst.value = x; inst.focus(); }))); zona.append(el("p", {class:"nota"}, "Ideas de " + p.name.split(" ")[0] + ":"), o); }
    const inst = el("textarea", {rows:"3", placeholder:"Ej.: dile que sí podemos, pero que necesito la fecha del bautizo", "aria-label":"Qué hay que contestar"}); if (previa) inst.value = previa;
    const gen = boton("Redactar de nuevo", "ok", async () => {
      const v = inst.value.trim(); if (!v) return;
      gen.disabled = true; estado.className = "estado"; estado.textContent = p.name.split(" ")[0] + " está redactando…";
      try {
        const pedido = p.persona + "\n\n" + FACTS + "\n\nVas a redactar la respuesta a un correo de una clienta. Idioma de la clienta (" + (f.Idioma || "el del correo") + "). Tuteo salvo que ella use usted. Escribe como Pilar en un correo normal, no como una empresa: cercano, corto, de tú, respondiendo justo a lo que pregunta y sin frases de formulario (\"no dudes en\", \"quedamos a tu disposición\", \"gracias por contactar\"). Cierra con \"Un saludo\". No digas nunca que algo \"se puede estudiar\" para un producto de la web: los precios están en la web de La Nonna y no se inventan. Las medidas se toman por videollamada: la clienta necesita un metro de costura y al niño o niña delante, y se le envía un documento con cómo medirles. Si no hay fecha máxima para encargar, se dice que se recomienda hacerlo cuanto antes porque la agenda se va llenando y se rechazan pedidos. Las confirmaciones con Pilar se hacen en este chat, nunca dentro del correo: no escribas \"te lo confirmo\", \"déjame confirmar\", \"lo miro y te digo\" ni parecido. Redacta el correo completo con lo que Pilar te ha dicho; si te falta algo, pregúntaselo a ella en el mensaje y deja entre corchetes lo que falte. Si hablas de pago, pide el número de pedido en el concepto o el justificante. Acaba con esta firma, tal cual:\n" + FIRMA + "\n\nDevuelve SOLO el texto del correo, sin comillas ni explicaciones.\n\nCorreo de la clienta:\n" + (f["Correo original"] || "") + "\n\nBorrador que se ha rechazado:\n" + (f["Respuesta propuesta"] || "") + "\n\nLo que quiere Pilar que se conteste:\n" + v;
        const r = await sample(pedido, {cache: false});
        ta.value = (r && r.text) || ta.value; ta.readOnly = false; estado.textContent = "Aquí lo tienes. Léelo, cámbialo si quieres y acéptalo.";
        zona.textContent = ""; zona.append(boton("Aceptar este", "ok", () => aceptar(ta.value)), boton("Probar otra vez", "sec", () => abrirRechazo(v)), boton("Cancelar", "sec", cerrar));
      } catch (e){ estado.className = "estado mal"; estado.textContent = e && e.code === "not_granted" ? "Permite que la página consulte a Claude para que redacte." : "No he podido redactarlo. Inténtalo otra vez."; gen.disabled = false; }
    });
    zona.append(inst, gen, boton("Cancelar", "sec", cerrar)); inst.focus();
  }
  c.append(fila, zona, estado);
  return c;
}

/* ---------- Lista de correos + ficha (pestañas "Por aprobar" y "Hechas") ---------- */
function bandejaLista(box, p, filas, hechas, recargar){
  const aviso = el("p", {class:"estado ok", role:"status", "aria-live":"polite"});
  if (!filas.length){ box.append(el("p", {class:"vacio"}, hechas ? "Todavía no hay nada aceptado." : "No hay correos esperando tu OK en la bandeja de " + p.name.split(" ")[0] + "."), aviso); return; }
  filas = filas.slice().sort((a, b) => nivel(b.Urgencia) - nivel(a.Urgencia) || String(b.Recibido).localeCompare(String(a.Recibido)));
  if (!filas.some(x => x.ID === vista.sel)) vista.sel = filas[0].ID;
  const grid = el("div", {class:"duo"}); const lista = el("div", {class:"correos", role:"list"}); const det = el("div", {class:"detalle"});
  const pintar = () => {
    lista.textContent = ""; det.textContent = "";
    filas.forEach(f => {
      const fc = parseFecha(f["Fecha ISO"]) || parseFecha(f["Fecha ceremonia"]); const dd = dias(fc); const u = nivel(f.Urgencia);
      const b = el("button", {type:"button", class:"corr u" + u, role:"listitem", "aria-pressed": String(f.ID === vista.sel)});
      b.append(el("b", {}, f.Clienta || f["Email clienta"] || "Sin nombre"), el("small", {}, f.Asunto || ""),
        el("span", {class:"mini"}, (u ? nombreNivel(u) : "Sin valorar") + (fc && dd != null ? " · " + (dd >= 0 ? dd + " días" : "pasada") : " · sin fecha")));
      b.onclick = () => { vista.sel = f.ID; pintar(); }; lista.append(b);
    });
    const f = filas.find(x => x.ID === vista.sel);
    det.append(ficha(f, p, D, txt => { aviso.textContent = txt; recargar(); }));
  };
  grid.append(lista, det); box.append(aviso, grid); pintar();
}

  D.prop.filter(f => f.Estado !== "Rechazada" && ["Sofia Lara", "Paula Navarro", "Lucia Ortega"].includes(f.Persona.normalize("NFD").replace(/[̀-ͯ]/g, ""))).forEach(f => añadir(f.Clienta, parseFecha(f["Fecha ISO"])));
  D.ped.forEach(f => añadir(f.Clienta, parseFecha(f["Fecha ceremonia"])));

    const w = new Date(ini); w.setDate(w.getDate() + i * 7); const k = w.toISOString().slice(0, 10); const n = contados[k] || 0;

  if (!vig.length) box.append(el("p", {class:"vacio"}, "No hay ninguna. Cuando una semana se llene, Pilar decidirá aquí si se cierran pedidos o se aceptan."));
  else { const ul = el("ul", {class:"hist"}); vig.forEach(x => ul.append(el("li", {}, x.Consigna + (x["Hasta (fecha ceremonia)"] ? " · hasta " + x["Hasta (fecha ceremonia)"] : "") + (x["Decidida por"] ? " · " + x["Decidida por"] : "")))); box.append(ul); }

function idiomaDe(t){
  t = " " + String(t || "").toLowerCase().replace(/a t e l i e r[\s\S]*$/, "").replace(/[^a-záéíóúüñàâçèêëîïôùûœ\s]/g, " ").replace(/\s+/g, " ") + " ";
  const cuenta = lista => lista.reduce((n, w) => n + (t.split(" " + w + " ").length - 1), 0);
  const es = cuenta(["de", "que", "el", "la", "los", "las", "y", "en", "un", "una", "para", "con", "por", "gracias", "buenos", "buenas", "hola", "saludo", "te", "tu", "nos", "es", "muchas", "días", "dinos", "pedido", "si", "lo", "se"]);
  const en = cuenta(["the", "and", "you", "your", "for", "thank", "thanks", "good", "morning", "afternoon", "best", "regards", "we", "is", "are", "to", "of", "with", "please", "will", "have", "this", "that", "our", "wishes", "hello", "dear"]);
  const fr = cuenta(["le", "les", "des", "vous", "votre", "est", "nous", "pour", "bonjour", "merci", "avec", "une", "et", "cordialement", "je", "pas", "bonsoir", "du"]);
  if (en > es && en >= fr) return "en";
  if (fr > es && fr > en) return "fr";
  return "es";
}
const NOMBRE_IDIOMA = {en: "inglés", fr: "francés"};

const horaAhora = () => new Date().toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
const horaDe = x => { const m = String(x || "").match(/(\d{1,2}:\d{2})/); return m ? m[1] : ""; };

const fin = t => { t = String(t || "").trim(); return /[.?!…]$/.test(t) ? t : t + "."; };
function cuandoEscribio(f){
  const d = f["Fecha correo"] ? new Date(f["Fecha correo"]) : null;
  if (!d || isNaN(d)){ const h = horaDe(f.Recibido); return h ? "hoy a las " + h : "hoy"; }
  const dif = Math.round((HOY - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  const hh = d.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
  const dia = dif === 0 ? "hoy" : dif === 1 ? "ayer" : "el " + d.toLocaleDateString("es-ES", {day: "numeric", month: "long"});
  return dia + " a las " + hh;
}

function itemsChat(t){
  const out = [];
  t.dudas.forEach(d => { const f = D.prop.find(x => x.ID === d["ID propuesta"]); out.push({tipo: "duda", id: d.ID, d, f, quien: d["Quién la pide"], nivel: f ? nivel(f.Urgencia) : 2, titulo: f ? (f.Clienta || f["Email clienta"] || "") : "", preview: "Duda: " + d["Qué hay que decidir"]}); });
  t.decs.forEach(d => out.push({tipo: "dec", id: d.ID, d, quien: d["Quién la pide"], nivel: 2, titulo: "Decisión", preview: d["Qué hay que decidir"]}));
  t.envios.forEach(f => { let prev = f.Resumen || f.Asunto || ""; try { const c = f["Conversación"] ? JSON.parse(f["Conversación"]) : null; if (c && c.length){ const u = c[c.length - 1]; prev = (u.de === "pilar" ? "Tú: " : "") + (u.texto || (u.borrador ? "Borrador nuevo" : prev)); } } catch (e){}

const CLARA_SISTEMA = "Eres Clara Vega, triaje del departamento de Ventas de La Nonna (ropa a medida de arras, bautizo y comunión, atelierlanonna.com). Lees UN correo recibido en info@ y respondes SOLO con un JSON válido, sin texto alrededor.\n\nReparto (campo \"persona\"):\n- \"ruido\": no es de una clienta (Stripe, MRW, proveedores, facturas, comunidad de vecinos, comerciales, avisos automáticos, agenda de Calendar).\n- \"Lucia Ortega\": quiere cita o hay aviso de Cal.\n- \"Sofia Lara\": primera consulta, presupuesto, pedido nuevo.\n- \"Paula Navarro\": clienta con pedido en marcha (medidas, envío, pagos, justificantes, cambios).\n- \"Diego Salas\": algo ha ido mal (talla, retraso, error, devolución, queja).\n\nSi \"persona\" es distinta de \"ruido\", redacta en \"respuesta\" el borrador que enviaría La Nonna.\n\nESTILO, lo más importante: escribe como lo haría Pilar en un correo normal a una clienta, no como una empresa. Cercano, natural, de tú (de usted solo si ella lo usa), en el idioma de la clienta y con buena ortografía. Corto: responde justo a lo que pregunta y en el orden en que lo pregunta, en frases sencillas. Saludo \"Buenos días, Nombre.\" (o \"Hola, Nombre.\" si ella escribe más informal; Good morning / Bonjour en otros idiomas). Cierre sencillo: \"Muchas gracias. Un saludo\" o solo \"Un saludo\". Prohibido el lenguaje de formulario o de atención al cliente: nada de \"gracias por contactar con nosotras\", \"estimada\", \"nos complace\", \"no dudes en\", \"quedamos a tu disposición\", \"es un placer\", ni \"un abrazo\". Sin listas, viñetas, negritas ni títulos; solo párrafos cortos. Si la clienta cuenta algo personal (un parto, una operación), una frase humana al principio. Firma al final:\nA T E L I E R   L A   N O N N A\nwww.atelierlanonna.com\ninfo@atelierlanonna.com\n669 49 68 31\n\nCómo contestan en La Nonna a lo habitual (usa estas ideas y casi estas palabras):\n- Fecha máxima para encargar: \"No tenemos una fecha máxima, pero te recomendamos hacerlo cuanto antes porque después se nos va llenando la agenda y tenemos que rechazar pedidos.\"\n- Medidas: se toman por videollamada y no hace falta ir al taller. \"Necesitamos tomar las medidas para confeccionar tu pedido. Dinos qué disponibilidad tienes, con un margen de tiempo porque tardamos unos minutos. Tienes que tener un metro de costura y al niño o niña delante. Lo hacemos por videollamada, así que si nos das un número de teléfono te llamamos.\" Además, se les envía un documento que explica cómo medirles: dilo (\"te mando también un documento con cómo medirle\") y pon en \"alerta\" que hay que adjuntar ese documento antes de enviar.\n- Cómo formalizar un pedido: se envía el presupuesto para que comprueben que todo está correcto, y el pedido queda pendiente hasta que se hace el pago; se paga por transferencia poniendo como concepto el número de pedido, o enviando el justificante. Pasadas 48 horas sin noticias se anula. No des los datos bancarios tú: di que van en el presupuesto.\n- Fechas de entrega de la web: \"las fechas de entrega de los pedidos en algunos casos no son definitivas, lo que vale es lo que anotamos en observaciones, porque la web obliga a poner una fecha posterior a la que nos has pedido\".\n- Taller cerrado en noviembre hasta el 5 de diciembre: contactan a principios de diciembre para tomar las medidas.\n\nPRECIOS: nunca digas \"se puede estudiar\". Busca el producto en el CATÁLOGO DE LA WEB que viene debajo del correo y da su precio exacto. Si no aparece, o piden un cambio que no está en la web (otro largo, otro color, otro tejido), no lo dejes en el aire: ve a \"duda\" y pregunta a Pilar el precio o si se puede, proponiendo lo que harías.\n\nCONFIRMACIONES CON PILAR (muy importante): las confirmaciones con Pilar se hacen en el chat con ella, ANTES de enviar, nunca dentro del correo a la clienta. Por eso el borrador NUNCA dice \"te lo confirmo\", \"te confirmo\", \"déjame confirmar\", \"lo miro y te digo\", \"lo consulto\", \"lo hablo y te cuento\" ni nada parecido. Cuando algo depende de Pilar (si llegamos a una fecha, un precio fuera de la web, si se acepta un pedido, una cita, una excepción), haz esto: 1) ponlo en \"duda\" como una pregunta concreta a Pilar con tu propuesta (\"¿Le digo que sí llegamos para el 12 de diciembre?\"); 2) redacta el borrador completo asumiendo tu propuesta, como si ya estuviera decidido, para que Pilar solo tenga que aprobarlo o cambiarlo; 3) si no hay propuesta razonable, deja entre corchetes lo que falta, por ejemplo [PRECIO DEL CAMBIO DE LARGO], para que no se envíe por error.\n\nReglas del borrador: pregunta SIEMPRE primero la fecha de la ceremonia si no la dice; al pedir pago, pide el número de pedido en el concepto o el justificante; ahora no se aceptan pedidos para antes de mediados de diciembre salvo que Pilar decida otra cosa.\n\nCampos del JSON: {\"persona\": \"...\", \"clienta\": \"nombre\", \"idioma\": \"es|en|fr|otro\", \"fecha_ceremonia\": \"texto o vacío\", \"fecha_iso\": \"YYYY-MM-DD de la ceremonia si la dice con claridad (el año actual es 2026 si no lo dice), si no vacío\", \"respuesta\": \"borrador o vacío\", \"motivo\": \"una frase de por qué va a esa persona\", \"resumen\": \"dos frases: qué quiere la clienta y en qué punto está\", \"prenda\": \"prenda o piezas que mencionan o vacío\", \"urgencia\": \"alta|media|baja + una razón corta\", \"pago\": \"sin pedido|pendiente|justificante recibido|pagado|no aplica\", \"falta\": \"qué datos faltan para avanzar (fecha de ceremonia, medidas, número de pedido, justificante...) o vacío\", \"alerta\": \"riesgo a vigilar o algo que Pilar debe hacer antes de enviar (adjuntar el documento de medidas, fecha que no da tiempo...) o vacío\", \"pedido\": \"número de pedido si lo menciona o vacío\", \"opciones\": \"si es una incidencia o hay varias salidas posibles, 2 o 3 alternativas en una línea cada una separadas por ' | '; si no, vacío\", \"decision\": \"déjalo siempre vacío: las confirmaciones con Pilar van en \\\"duda\\\"\", \"recomendacion\": \"vacío\"}";
const CLARA_EXTRA = "REPARTO A CONTABILIDAD (tiene prioridad sobre el reparto de arriba): si el correo es de Stripe (pagos recibidos, liquidaciones, informes, alertas, disputas), del banco, de la gestoría, de Hacienda o impuestos, o trata de cobros, devoluciones de dinero, pagos de clientas que hay que cuadrar o cualquier tema de contabilidad, pon \"persona\": \"Ivan Soler\", deja \"respuesta\" vacío (no se contesta), en \"resumen\" explica en una frase qué es y en \"falta\" qué debería revisar Iván. EXCEPCIÓN: las facturas de proveedores, los albaranes y los packing lists ya los gestiona Iván por otro flujo: esos son \"ruido\". Una clienta que envía el justificante de su pago de un pedido NO va a Iván: es de Paula o Sofía, como siempre.\n\nCAMPOS EXTRA (añádelos al JSON): \"duda\": si algo depende de Pilar (una fecha que quizá no da tiempo, un precio que no está en el catálogo, un cambio a medida, aceptar un pedido, una cita, una excepción) o no sabes cómo contestar, escribe aquí la pregunta concreta que le harías a Pilar, en una o dos frases, con tu propuesta incluida; si lo sabes todo, vacío. \"sugerencia\": lo que harías si Pilar no dice otra cosa, en una frase. \"mensaje_pilar\": el mensaje que la empleada le escribe a Pilar, en primera persona, natural y cercano, de 3 a 5 frases, SIN saludo ni la frase de quién ha escrito (eso ya lo añade la página). Debe decir: 1) qué quiere la clienta, 2) \"Necesito que me digas si te parece bien decirle ...\" seguido de lo que propones contestar en concreto (y, si hay duda, la duda), y 3) acabar exactamente con: \"Te paso una propuesta de email; dime si ves que tengo que hacer algún cambio antes de mandarlo.\" REGLAS DURAS: (a) el borrador nunca dice \"te confirmo\", \"déjame confirmar\", \"lo miro y te digo\" ni parecido; (b) si piden un cambio a medida que no está en la web (otro largo, otro color, otro tejido, añadir o quitar piezas), NUNCA afirmes en el borrador que se puede hacer ni que cuesta lo mismo o un precio concreto: pon la duda a Pilar y en el borrador escribe [CAMBIO A CONFIRMAR: descripción] y [PRECIO DEL CAMBIO] entre corchetes; (c) nunca inventes datos de la clienta que no estén en el hilo. Usa el hilo anterior para entender de qué se hablaba (modelo, fechas, pedido) antes de preguntar nada. Escribe siempre \"idioma\" con es, en, fr u otro. Responde con un JSON completo y válido, sin cortarlo.";
const LOTE = 6;

async function filaNueva(hoja){ const v = await leerHoja(hoja + "!A1:A3000"); return v.length + 1; }
async function cabeceraDe(hoja, ultima){ const v = await leerHoja(hoja + "!A1:" + ultima + "1"); return (v[0] || []).map(String); }
function colLetra(n){ let s = ""; while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
async function apuntarFila(hoja, obj){
  const cab = await cabeceraDe(hoja, "AD"); const n = await filaNueva(hoja);
  const fila = cab.map(h => obj[h] == null ? "" : obj[h]);
  await escribirHoja(hoja + "!A" + n + ":" + colLetra(fila.length) + n, [fila]);
  return n;
}
function leerJson(txt){
  const m = String(txt || "").match(/\{[\s\S]*\}/); if (!m) return null;
  try { return JSON.parse(m[0]); } catch (e) { return null; }
}

async function prepararUno(f, catalogo, consignas, k){
  const ahora = new Date().toISOString().slice(0, 16).replace("T", " ");
  const pedido = CLARA_SISTEMA + "\n\n=====\n\nHoy es " + new Date().toISOString().slice(0, 10) + ".\n\nDe: " + f.De + "\nAsunto: " + f.Asunto + "\nFecha: " + f["Fecha correo"] + "\nAviso de lista de correo masivo: " + f["Lista masiva"] + "\n\nHILO DE CORREOS ANTERIOR (del más antiguo al más reciente; puede estar vacío):\n" + (f.Hilo || "") + "\n\nÚLTIMO CORREO DE LA CLIENTA (este es el que hay que contestar):\n" + f.Texto + "\n\n---\nCATÁLOGO DE LA WEB (precios reales, de aquí se sacan los precios):\n" + catalogo + (consignas ? "\n\n---\nCONSIGNAS VIGENTES DE PILAR:\n" + consignas : "") + "\n\n---\n" + CLARA_EXTRA;
  let d = null;
  try { const r = await sample(pedido, {cache: false}); d = leerJson(r && r.text); } catch (e) { if (e && (e.code === "not_granted" || e.code === "rate_limited")) throw e; d = null; }
  const id = "P-" + Date.now().toString(36) + k;
  const mail = f.Email || ""; const nombre = f.Nombre || "";
  if (!d){
    await apuntarFila("Propuestas", {ID: id, Recibido: ahora, Persona: "Clara Vega", Clienta: nombre, "Email clienta": mail, Asunto: f.Asunto, "Correo original": f.Texto, Motivo: "No he conseguido leer bien la respuesta de la IA para este correo", Estado: "Pendiente", "ID mensaje Gmail": f["ID mensaje Gmail"], Resumen: "No he podido preparar el borrador de este correo.", Urgencia: "media: sin valorar", Hilo: f.Hilo, "Fecha correo": f["Fecha correo"], "Mensaje a Pilar": "No he conseguido preparar bien el borrador de este correo. Léelo y dime cómo quieres contestarle, y te lo redacto."});
    return "fallo";
  }
  const persona = String(d.persona || "");
  if (!persona || /ruido/i.test(persona)){
    await apuntarFila("Descartados", {"ID mensaje Gmail": f["ID mensaje Gmail"], Fecha: ahora, De: f.De, Asunto: f.Asunto});
    return "ruido";
  }
  if (/ivan/i.test(persona)){
    await apuntarFila("Contabilidad", {"ID mensaje Gmail": f["ID mensaje Gmail"], Fecha: ahora, De: f.De, Asunto: f.Asunto, "Qué es": d.resumen || "", "Qué hay que revisar": d.falta || d.motivo || "", Estado: "Pendiente", "Nota de Iván": "", "Texto del correo": String(f.Texto || "").slice(0, 3000)});
    await apuntarFila("Descartados", {"ID mensaje Gmail": f["ID mensaje Gmail"], Fecha: ahora, De: f.De, Asunto: "[Contabilidad] " + f.Asunto});
    return "iván";
  }
  await apuntarFila("Propuestas", {ID: id, Recibido: ahora, Persona: persona, Clienta: d.clienta || nombre, "Email clienta": mail, Asunto: f.Asunto, "Correo original": f.Texto, "Respuesta propuesta": d.respuesta || "", Motivo: d.motivo || "", Estado: "Pendiente", Idioma: d.idioma || "", "Fecha ceremonia": d.fecha_ceremonia || "", "ID mensaje Gmail": f["ID mensaje Gmail"], Resumen: d.resumen || "", Prenda: d.prenda || "", Urgencia: d.urgencia || "", Pago: d.pago || "", Falta: d.falta || "", Alerta: d.alerta || "", "Fecha ISO": d.fecha_iso || "", Pedido: d.pedido || "", Opciones: d.opciones || "", Hilo: f.Hilo || "", "Fecha correo": f["Fecha correo"], "Mensaje a Pilar": d.mensaje_pilar || "", "_sugerencia": d.sugerencia || "", "_recomendacion": d.recomendacion || ""});
  if (d.duda){
    await apuntarFila("Decisiones", {ID: "D-" + Date.now().toString(36) + k, Creada: ahora, "Quién la pide": persona, Tipo: "Duda", "Qué hay que decidir": d.duda + " (" + (d.clienta || nombre) + " — " + f.Asunto + ")", "Recomendación": d.sugerencia || "", Estado: "Pendiente", "Decisión de Pilar": "", "Departamento con quien hablar": "Ventas — " + persona, "ID propuesta": id});
  }
  return "propuesta";
}

function bloquePreparar(box){
  const w = el("section", {class:"extracto", "aria-label":"Correos por preparar"});
  const est = el("p", {class:"estado", role:"status", "aria-live":"polite"}, "Mirando si hay correos nuevos…");
  const acc = el("div", {class:"aj"});
  w.append(el("h3", {}, "Correos nuevos de info@"), est, acc); box.append(w);
  let pendientes = [];
  const pintar = async () => {
    acc.textContent = "";
    let aviso = "";
    try { const n = await traerCorreosNuevos(); if (n) aviso = "He traído " + n + (n === 1 ? " correo nuevo" : " correos nuevos") + " de info@. "; }
    catch (e){ aviso = mensajeCorreo(e) + " "; }
    try { pendientes = await correosSinPreparar(); } catch (e){ est.className = "estado mal"; est.textContent = mensajeHoja(e); return; }
    est.className = "estado";
    if (!pendientes.length){ est.textContent = aviso + "No hay correos sin preparar."; acc.append(boton("Mirar info@ otra vez", "sec", pintar)); return; }
    est.textContent = aviso + pendientes.length + (pendientes.length === 1 ? " correo espera" : " correos esperan") + " a que Clara y su equipo lo preparen. No se envía nada ni se marca como leído.";
    if (!sample){ est.textContent += " Desde esta vista no puedo prepararlos."; return; }
    const b = boton("Preparar propuestas", "", async () => {
      b.disabled = true; est.className = "estado";
      try {
        const cat = await leerHoja("Catálogo!B2"); const catalogo = (cat[0] && cat[0][0]) || "(no he podido leer el catálogo de la web)";
        await cargarDatos(true);
        const consignas = D.con.filter(x => norm(x.Vigente) !== "no" && x.Consigna).map(x => "- " + x.Consigna + (x["Hasta (fecha ceremonia)"] ? " (hasta " + x["Hasta (fecha ceremonia)"] + ")" : "")).join("\n");
        const lote = pendientes.slice(0, LOTE); const cuenta = {propuesta: 0, ruido: 0, "iván": 0, fallo: 0};
        for (let i = 0; i < lote.length; i++){
          est.textContent = "Preparando el correo " + (i + 1) + " de " + lote.length + "…";
          const r = await prepararUno(lote[i], catalogo, consignas, i);
          cuenta[r]++;
          await escribirHoja("Entrada!K" + lote[i]._fila, [["Preparado"]]);
        }
        const partes = [cuenta.propuesta && cuenta.propuesta + " con propuesta", cuenta["iván"] && cuenta["iván"] + " para Iván", cuenta.ruido && cuenta.ruido + " descartados", cuenta.fallo && cuenta.fallo + " que no he sabido leer"].filter(Boolean);
        trabajo.nota = "He preparado " + lote.length + ": " + partes.join(", ") + "." + (pendientes.length > LOTE ? " Quedan " + (pendientes.length - LOTE) + ": vuelve a pulsar." : "");
        D.t = 0; pintarTrabajo(box);
      } catch (e){
        est.className = "estado mal";
        est.textContent = (e && e.code === "rate_limited") ? "Voy muy seguido; espera un minuto y vuelve a pulsar." : (e && e.code === "not_granted") ? "Necesito que me dejes usar Claude desde esta página." : mensajeHoja(e);
        b.disabled = false;
      }
    });
    acc.append(b);
  };
  pintar();
  return w;
}

/* ---------- Oficina isométrica ---------- */
const W = 17, H = 13, S = 34, OX = H*0.866*S + 30, OY = 120;
const P = (x, y, z) => [OX + (x - y) * 0.866 * S, OY + (x + y) * 0.5 * S - z * S];
const pts = a => a.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
const poly = (a, fill, extra="") => '<polygon points="' + pts(a) + '" fill="' + fill + '" ' + extra + '/>';
function box(x, y, z, w, d, h, c){
  return poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)], c.l)
       + poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)], c.r)
       + poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)], c.t);
}

const shirt = hex => ({t: shade(hex, 1.12), l: hex, r: shade(hex, .78)});
const COLORS = {dir:"#6b5bd6", com:"#d1584e", cont:"#1f8a68", ate:"#c9861a", comp:"#2d74bf"};
const LOOK = {carla:["#f1c9a5","#3a2a22"], nerea:["#e8b48c","#7a3b24"], alvaro:["#d9a37a","#1f1b1a"], ivan:["#f0c8a0","#4a3426"], sofia:["#c98f66","#1b1412"], hugo:["#e9b995","#8a6a3c"], clara:["#f0c8a0","#2b2018"], marta:["#e3b08a","#5a2e1c"], lucia:["#d49b72","#201a18"], paula:["#f1cfae","#8a5a2c"], diego:["#cf9a70","#2a2220"]};
const TAG = {carla:"Directora", nerea:"Comunicación", alvaro:"Director", ivan:"Contable", sofia:"Pedidos", hugo:"Compras", clara:"Triaje", marta:"Capacidad", lucia:"Citas", paula:"Seguimiento", diego:"Incidencias"};
const SPOT = {carla:[1.4,1.0,2.4], nerea:[6.2,1.0,2.4], alvaro:[1.2,6.0,2.2], ivan:[4.2,6.0,2.2], clara:[8.2,6.0,2.2], marta:[11.0,6.0,2.2], lucia:[13.8,6.0,2.2], sofia:[8.2,9.8,2.2], paula:[11.0,9.8,2.2], diego:[13.8,9.8,2.2], hugo:[1.4,10.2,2.4]};
const RUGS = {direccion:[0.6,0.5,4.8,3.9], comunicacion:[5.4,0.5,9.6,3.9], contabilidad:[0.6,5.2,7.2,9.4], ventas:[7.8,5.5,16.4,12.5], compras:[0.6,9.8,4.8,12.4]};
const DCOLOR = {direccion:"dir", comunicacion:"com", contabilidad:"cont", ventas:"ate", compras:"comp"};

function plant(x, y){
  const [fx, fy] = P(x + .3, y + .3, 1.0);
  return box(x, y, 0, .6, .6, .5, POT)
    + '<ellipse cx="' + fx.toFixed(1) + '" cy="' + (fy-4).toFixed(1) + '" rx="15" ry="13" fill="#3f8f5c"/>'
    + '<ellipse cx="' + (fx-5).toFixed(1) + '" cy="' + (fy-9).toFixed(1) + '" rx="9" ry="8" fill="#58b077"/>';
}

let TAGS = [];
function workstation(id, person, color){
  const [dx, dy, w] = SPOT[id]; const cx = dx + w / 2; const sk = LOOK[id][0], hr = LOOK[id][1];
  const sh = shirt(color);
  let g = box(dx + .12, dy + .1, 0, .08, .8, .68, LEG) + box(dx + w - .2, dy + .1, 0, .08, .8, .68, LEG)
    + box(dx, dy, .68, w, 1.0, .08, WOOD)
    + box(cx - .1, dy + .25, .76, .2, .2, .12, LEG) + box(cx - .5, dy + .22, .86, 1.0, .1, .6, MON)
    + box(cx - .42, dy + .55, .76, .84, .26, .03, KEY)
    + box(cx - .06, dy + 1.38, 0, .12, .12, .42, CHAIR) + box(cx - .4, dy + 1.12, .42, .8, .72, .1, CHAIR)
    + box(cx - .3, dy + 1.28, .52, .6, .42, .8, sh)
    + box(cx - .4, dy + 1.76, .5, .8, .1, .55, CHAIR);
  const [hx, hy] = P(cx, dy + 1.5, 1.72);
  g += '<circle cx="' + hx.toFixed(1) + '" cy="' + (hy - 2).toFixed(1) + '" r="11" fill="' + hr + '"/>'
     + '<circle cx="' + hx.toFixed(1) + '" cy="' + (hy + 1).toFixed(1) + '" r="9.5" fill="' + sk + '"/>'
     + '<ellipse cx="' + hx.toFixed(1) + '" cy="' + (hy - 5).toFixed(1) + '" rx="10.5" ry="6" fill="' + hr + '"/>';
  const label = person.name.split(" ")[0] + " · " + TAG[id];
  const tw = Math.round(label.length * 6.6 + 18);
  const ty = hy - 44;
  const sel = person.id === personId;
  const g2 = '<g class="char' + (sel ? " sel" : "") + '" data-p="' + id + '" tabindex="0" role="button" aria-label="Hablar con ' + person.name + ', ' + person.role + '" style="--tc:' + color + '">'
    + g
    + (sel ? '<ellipse cx="' + P(cx, dy + 1.5, 0)[0].toFixed(1) + '" cy="' + (P(cx, dy + 1.5, 0)[1] + 8).toFixed(1) + '" rx="42" ry="13" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-dasharray="5 4"/>' : '')
    + '</g>';
  TAGS.push('<g class="char tagg' + (sel ? " sel" : "") + '" data-p="' + id + '" style="--tc:' + color + '"><g class="tag"><rect class="tagbox" x="' + (hx - tw / 2).toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + tw + '" height="24" rx="12"/>'
    + '<text class="tagtxt" x="' + hx.toFixed(1) + '" y="' + (ty + 16).toFixed(1) + '" text-anchor="middle">' + label + '</text></g></g>');
  return g2;
}

function renderScene(){
  const people = {}; DEPTS.forEach(d => d.people.forEach(p => people[p.id] = {p, d}));
  let svg = '<svg viewBox="0 0 960 640" role="group" aria-label="Oficina isométrica con el equipo de La Nonna">';
  // suelo y paredes
  svg += poly([P(0,H,0),P(W,H,0),P(W,H,-.5),P(0,H,-.5)], "#c9b592") + poly([P(W,0,0),P(W,H,0),P(W,H,-.5),P(W,0,-.5)], "#b4a07c")
       + poly([P(0,0,0),P(W,0,0),P(W,H,0),P(0,H,0)], "#ecdcc0")
       + poly([P(0,0,0),P(W,0,0),P(W,0,3.4),P(0,0,3.4)], "#ebe4d8") + poly([P(0,0,0),P(0,H,0),P(0,H,3.4),P(0,0,3.4)], "#d9cfbd")
       + poly([P(0,0,0),P(W,0,0),P(W,0,.25),P(0,0,.25)], "#b9a98f") + poly([P(0,0,0),P(0,H,0),P(0,H,.25),P(0,0,.25)], "#a99978");
  // ventanas (pared del fondo derecho) y pizarra
  [[2.0,3.6],[5.6,7.2],[9.2,10.8],[14.6,16.2]].forEach(w => { svg += poly([P(w[0],0,1.2),P(w[1],0,1.2),P(w[1],0,2.9),P(w[0],0,2.9)], "#bfe3f7", 'stroke="#f6f3ec" stroke-width="3"'); });
  svg += poly([P(11.6,0,1.1),P(14.0,0,1.1),P(14.0,0,2.7),P(11.6,0,2.7)], "#fbfbfd", 'stroke="#b9a98f" stroke-width="3"');
  // alfombras por departamento
  Object.keys(RUGS).forEach(id => {
    const r = RUGS[id], c = COLORS[DCOLOR[id]], on = id === deptId;
    svg += poly([P(r[0],r[1],.01),P(r[2],r[1],.01),P(r[2],r[3],.01),P(r[0],r[3],.01)], c, 'fill-opacity="' + (on ? .26 : .12) + '" stroke="' + c + '" stroke-opacity="' + (on ? .9 : .35) + '" stroke-width="' + (on ? 2.5 : 1.2) + '"');
  });
  // sala de reuniones
  const rr = [10.2,0.5,14.4,5.4];
  svg += poly([P(rr[0],rr[1],.01),P(rr[2],rr[1],.01),P(rr[2],rr[3],.01),P(rr[0],rr[3],.01)], "#8f98b3", 'fill-opacity=".16" stroke="#8f98b3" stroke-opacity=".5" stroke-width="1.2"');
  const items = []; TAGS = [];
  items.push({k: 12.6 + 3.2, svg: box(11.3,1.8,.68,2.8,1.5,.1,TABLE) + box(11.6,2.0,0,.12,.12,.68,LEG) + box(13.6,2.0,0,.12,.12,.68,LEG) + box(11.6,2.9,0,.12,.12,.68,LEG) + box(13.6,2.9,0,.12,.12,.68,LEG)});
  [[11.5,1.2],[12.6,1.2],[13.4,1.2],[11.5,3.5],[12.6,3.5],[13.4,3.5]].forEach(c => items.push({k: c[0]+c[1]+.3, svg: box(c[0]-.25,c[1]-.25,.4,.55,.55,.1,CHAIR) + box(c[0]-.05,c[1]-.05,0,.1,.1,.4,LEG)}));
  const [lx, ly] = P(12.4, 4.9, 0);
  items.push({k: 99, svg: '<text class="zlabel" x="' + lx.toFixed(0) + '" y="' + ly.toFixed(0) + '" text-anchor="middle">REUNIONES</text>'});
  [[5.1,4.0],[0.5,12.4],[16.4,12.6],[7.1,12.2],[7.3,4.6]].forEach(c => items.push({k: c[0]+c[1], svg: plant(c[0], c[1])}));
  // glass
  items.push({k: 5.1 + 2, svg: box(5.0,.6,0,.05,3.2,1.5,{t:"rgba(180,215,235,.55)",l:"rgba(160,200,225,.45)",r:"rgba(140,185,215,.45)"})});
  Object.keys(SPOT).forEach(id => { const o = people[id]; items.push({k: SPOT[id][0] + SPOT[id][2] / 2 + SPOT[id][1] + 1, svg: workstation(id, o.p, COLORS[o.d.c])}); });
  items.sort((a, b) => a.k - b.k).forEach(i => svg += i.svg);
  TAGS.forEach(t => svg += t);
  svg += '</svg>';
  const sc = $("#scene"); sc.innerHTML = svg + '<p class="scene-cap">Haz clic en una persona para ver su trabajo y hablar con ella.</p>';
  sc.querySelectorAll(".char").forEach(g => {
    const go = () => { const o = people[g.dataset.p]; modo = "oficina"; deptId = o.d.id; personId = o.p.id; history.replaceState(null, "", "#" + deptId); renderAll(); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } });
  });
}

function renderAll(){ renderNav(); if (modo === "panel"){ renderTrabajo(); renderBandeja(); return; } if (!personId || !dept().people.some(p => p.id === personId)) personId = dept().people[0].id; renderScene(); renderFloor(); renderTeam(); renderChat(); renderBandeja(); renderTrabajo(); }
window.addEventListener("hashchange", () => { const h = location.hash.replace("#",""); if ((h === "panel" || h === "pilar") && modo !== "panel"){ modo = "panel"; renderAll(); return; } if (DEPTS.some(d => d.id === h) && h !== deptId){ deptId = h; personId = null; renderAll(); } });
$("#navOficina").onclick = () => { modo = "oficina"; history.replaceState(null, "", "#" + deptId); renderAll(); };
$("#navPanel").onclick = () => { modo = "panel"; history.replaceState(null, "", "#panel"); renderAll(); };
if (empiezaPanel) modo = "panel";
renderAll();
(async () => { try { sample = await window.claude?.use("sample"); } catch (e) { sample = null; } if (sample){ if (modo !== "panel") renderChat(); } })();
(async () => { try { mcp = await window.claude?.use("mcp"); } catch (e) { mcp = null; } if (mcp){ contarTareas(); if (modo === "panel") renderTrabajo(); else if (deptId === "ventas") renderBandeja(); else if (deptId === "contabilidad") renderTeam(); } })();
</script>
